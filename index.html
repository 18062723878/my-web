<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的个人网站</title>
<style>
:root{
  --color-text-primary:#1D1D1F;--color-text-secondary:#6E6E73;--color-text-tertiary:#86868B;
  --color-bg-primary:#FFFFFF;--color-bg-secondary:#F5F5F7;--color-accent:#0071E3;
  --header-bg:rgba(255,255,255,.8);--header-border:rgba(0,0,0,.06);
  --dot-border:#FFFFFF;--card-shadow:rgba(0,0,0,.1);
  --font-display:"SF Pro Display","PingFang SC",-apple-system,sans-serif;
  --font-text:"SF Pro Text","PingFang SC",-apple-system,sans-serif;
  --space-unit:8px;--space-section:120px;--space-block:64px;--space-element:24px;--space-inline:12px;
  --duration-fast:200ms;--duration-normal:400ms;--duration-slow:700ms;
  --ease-default:cubic-bezier(0.25,0.1,0.25,1);
  --radius-button:980px;--radius-card:18px;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-text-primary:#F5F5F7;--color-text-secondary:#A1A1A6;--color-text-tertiary:#86868B;
    --color-bg-primary:#000000;--color-bg-secondary:#161617;--color-accent:#2997FF;
    --header-bg:rgba(0,0,0,.75);--header-border:rgba(255,255,255,.1);
    --dot-border:#000000;--card-shadow:rgba(0,0,0,.5);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-text);color:var(--color-text-primary);background:var(--color-bg-primary);-webkit-font-smoothing:antialiased;transition:background-color var(--duration-normal) var(--ease-default),color var(--duration-normal) var(--ease-default)}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:var(--space-element);padding:0 var(--space-element);height:52px;background:var(--header-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--header-border)}
header .logo{font-family:var(--font-display);font-weight:600;font-size:17px}
header nav{margin-left:auto;display:flex;gap:var(--space-element)}
header nav a{color:var(--color-text-secondary);text-decoration:none;font-size:14px;transition:color var(--duration-fast) var(--ease-default)}
header nav a:hover{color:var(--color-text-primary)}

/* Apple 风格暗夜聚光灯 Hero 区域 */
.hero{
  position:relative;
  text-align:center;
  padding:var(--space-section) var(--space-element) 40px;
  background:#000000;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.hero-content{
  position:relative;
  z-index:2;
  max-width:760px;
  margin:0 auto;
}
.hero h1{
  font-family:var(--font-display);
  font-size:56px;
  line-height:1.08;
  font-weight:700;
  letter-spacing:-.025em;
  margin-bottom:var(--space-element);
  color:#F5F5F7;
  text-shadow:0 2px 20px rgba(0,0,0,0.8);
}
.hero p{
  font-size:21px;
  line-height:1.4;
  color:#A1A1A6;
  max-width:620px;
  margin:0 auto;
}
.hero-actions{margin-top:28px;display:flex;justify-content:center;gap:14px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--color-accent);
  color:#fff;
  text-decoration:none;
  border-radius:var(--radius-button);
  padding:12px 24px;
  font-size:15px;
  font-weight:500;
  box-shadow:0 4px 20px rgba(41,151,255,0.35);
  transition:transform var(--duration-fast),opacity var(--duration-fast);
}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.98)}

/* Michael Jackson 视觉融合展示组件 */
.hero-stage{
  position:relative;
  z-index:1;
  width:100%;
  max-width:860px;
  margin:20px auto 0;
  display:flex;
  justify-content:center;
  align-items:center;
}
.hero-stage::before{
  content:"";
  position:absolute;
  top:30%;
  left:50%;
  transform:translate(-50%,-50%);
  width:320px;
  height:320px;
  background:radial-gradient(circle, rgba(41,151,255,0.22) 0%, rgba(0,0,0,0) 70%);
  pointer-events:none;
  z-index:1;
}
.hero-stage-img{
  position:relative;
  z-index:2;
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:var(--radius-card);
  -webkit-mask-image:radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 95%);
  mask-image:radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 95%);
  filter:drop-shadow(0 10px 30px rgba(0,0,0,0.8));
  transition:transform var(--duration-slow) var(--ease-default);
}
.hero-stage-img:hover{
  transform:scale(1.02);
}

section{max-width:980px;margin:0 auto;padding:var(--space-section) var(--space-element)}
.section-head{text-align:center;margin-bottom:var(--space-block)}
.section-head h2{font-family:var(--font-display);font-size:40px;font-weight:600;letter-spacing:-.01em;margin-bottom:var(--space-inline)}
.section-head p{font-size:19px;color:var(--color-text-secondary)}

/* 个人简介 */
.about-card{background:var(--color-bg-secondary);border-radius:var(--radius-card);padding:var(--space-block) var(--space-element);max-width:840px;margin:0 auto;text-align:center;transition:background-color var(--duration-normal) var(--ease-default)}
.about-text{font-size:20px;line-height:1.6;color:var(--color-text-secondary);max-width:680px;margin:0 auto;white-space:pre-line}

/* 技能卡片 Bento Grid */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-element)}
.skill-card{background:var(--color-bg-secondary);border-radius:var(--radius-card);padding:var(--space-element);transition:transform var(--duration-fast) var(--ease-default),background-color var(--duration-normal) var(--ease-default)}
.skill-card:hover{transform:translateY(-3px)}
.skill-cat{font-size:12px;color:var(--color-accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.skill-name{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:6px}
.skill-desc{font-size:14px;line-height:1.5;color:var(--color-text-secondary)}

/* 时间线 + 项目卡片 */
.tl{position:relative;max-width:900px;margin:0 auto}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--color-accent),rgba(0,113,227,.12))}
.tl-item{position:relative;padding-left:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-element) var(--space-block);padding-bottom:var(--space-block)}
.tl-item.solo{grid-template-columns:1fr}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:var(--color-accent);border:3px solid var(--dot-border);box-shadow:0 0 0 2px var(--color-accent);transition:border-color var(--duration-fast)}
.tl-date{font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px;letter-spacing:.02em}
.tl-left h3{font-family:var(--font-display);font-size:24px;font-weight:600;margin-bottom:6px}
.tl-left p{font-size:17px;line-height:1.47;color:var(--color-text-secondary)}
.p-card{display:block;background:var(--color-bg-secondary);border-radius:var(--radius-card);padding:var(--space-element);text-decoration:none;color:inherit;transition:transform var(--duration-normal) var(--ease-default),box-shadow var(--duration-normal) var(--ease-default),background-color var(--duration-normal) var(--ease-default)}
.p-card:hover{transform:scale(1.02);box-shadow:0 12px 40px var(--card-shadow)}
.p-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-inline);margin-bottom:6px}
.p-top h4{font-family:var(--font-display);font-size:21px;font-weight:600}
.p-more{color:var(--color-accent);font-size:14px;white-space:nowrap}
.p-desc{font-size:15px;line-height:1.47;color:var(--color-text-secondary)}
.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-inline)}
.tag{background:var(--color-bg-primary);color:var(--color-accent);font-size:12px;padding:4px 12px;border-radius:var(--radius-button);transition:background-color var(--duration-fast)}

/* 联系卡片 */
.contact-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-inline);max-width:840px;margin:0 auto}
.c-item{background:var(--color-bg-secondary);border-radius:var(--radius-card);padding:20px var(--space-element);font-size:16px;text-align:center;overflow:hidden;transition:transform var(--duration-fast) var(--ease-default),background-color var(--duration-normal) var(--ease-default)}
.c-item:hover{transform:translateY(-3px)}
.c-item .c-label{display:block;font-size:12px;color:var(--color-text-tertiary);margin-bottom:6px}
.c-item a{display:block;color:var(--color-text-primary);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-item a:hover{color:var(--color-accent)}
.c-item span.c-val{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

footer{text-align:center;padding:var(--space-block) var(--space-element);background:var(--color-bg-secondary);color:var(--color-text-tertiary);font-size:12px;transition:background-color var(--duration-normal) var(--ease-default)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity var(--duration-slow) var(--ease-default),transform var(--duration-slow) var(--ease-default)}
.reveal.in{opacity:1;transform:none}
@media(max-width:734px){
  .hero{padding:var(--space-block) var(--space-element) 24px}
  .hero h1{font-size:38px}
  .hero-stage-img{max-height:320px}
  section{padding:var(--space-block) var(--space-element)}
  .section-head h2{font-size:32px}
  .tl-item{grid-template-columns:1fr}
  .about-text{font-size:17px}
}
</style>
</head>
<body>
<header>
  <span class="logo" id="siteName">我的个人网站</span>
  <nav>
    <a href="#aboutSec">简介</a>
    <a href="#skillsSec" id="navSkills">技能</a>
    <a href="#timelineSec">经历</a>
    <a href="#contact">联系</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-content">
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="hero-actions" id="heroActions" style="display:none">
      <a class="btn" id="resumeBtn" href="#" target="_blank">📄 预览 / 下载简历</a>
    </div>
  </div>

  <div class="hero-stage reveal in">
    <img 
      class="hero-stage-img" 
      src="mj.jpg" 
      alt="Michael Jackson Silhouette"
      onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='504470-michael-jackson-minimalism-hd-wallpaper-desktop-and-mobile-image-photo (1).jpg';}else if(this.dataset.tried==='1'){this.dataset.tried='2';this.src='mj.png';}"
    >
  </div>
</div>

<section id="aboutSec">
  <div class="section-head reveal"><h2>个人简介</h2><p id="aboutSub">保持好奇，专注创造价值</p></div>
  <div class="about-card reveal">
    <p class="about-text" id="aboutText">热衷于在设计与工程的交叉点探索，专注构建体验优雅、实用高效的产品与技术实践。</p>
  </div>
</section>

<!-- 技能卡片模块 -->
<section id="skillsSec">
  <div class="section-head reveal"><h2>技能与工具</h2><p>工欲善其事，必先利其器</p></div>
  <div class="skills-grid" id="skillsGrid"></div>
</section>

<section id="timelineSec">
  <div class="section-head reveal"><h2>我的经历</h2><p>每一个节点，都对应一个作品</p></div>
  <div class="tl" id="tlBox"></div>
</section>

<section id="contact">
  <div class="section-head reveal"><h2>联系我</h2><p>欢迎随时找我聊聊</p></div>
  <div class="contact-box" id="contactBox"></div>
</section>

<footer>© <span id="year"></span> · Powered by Cloudflare Pages</footer>

<script>
const $=id=>document.getElementById(id);
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
$("year").textContent=new Date().getFullYear();

fetch("/api/data").then(r=>r.json()).then(d=>{
  const site=d.site||{};
  if(site.name){document.title=site.name;$("siteName").textContent=site.name}
  $("heroTitle").textContent=site.heroTitle||"";
  $("heroSub").textContent=site.heroSub||"";

  // 简历按钮
  if(site.resumeUrl && site.resumeUrl.trim()){
    $("resumeBtn").href = site.resumeUrl.trim();
    $("heroActions").style.display = "flex";
  }

  // 个人简介
  if(site.about || site.bio) $("aboutText").textContent = site.about || site.bio;
  if(site.aboutSub) $("aboutSub").textContent = site.aboutSub;

  // 技能卡片 (Bento Grid)
  const skills = Array.isArray(d.skills) ? d.skills.filter(s=>s.name||s.cat) : [];
  if(!skills.length){
    $("skillsSec").style.display = "none";
    if($("navSkills")) $("navSkills").style.display = "none";
  } else {
    skills.forEach(s=>{
      const div = document.createElement("div");
      div.className = "skill-card reveal";
      div.innerHTML = 
        (s.cat ? '<div class="skill-cat">'+esc(s.cat)+'</div>' : '') +
        '<div class="skill-name">'+esc(s.name)+'</div>' +
        (s.desc ? '<div class="skill-desc">'+esc(s.desc)+'</div>' : '');
      $("skillsGrid").appendChild(div);
    });
  }

  // 时间线与项目
  const ts=(d.timeline||[]).filter(t=>t.title||t.date);
  if(!ts.length)$("timelineSec").style.display="none";
  ts.forEach(t=>{
    const p=t.project;
    const hasP=p&&(p.title||p.summary);
    const item=document.createElement("div");
    item.className="tl-item reveal"+(hasP?"":" solo");
    let right="";
    if(hasP){
      const tags=(p.tags||"").split(/[,，]/).map(x=>x.trim()).filter(Boolean)
        .map(x=>'<span class="tag">'+esc(x)+'</span>').join("");
      right='<a class="p-card" href="project.html?id='+encodeURIComponent(p.id||"")+'">'+
        '<div class="p-top"><h4>'+esc(p.title)+'</h4><span class="p-more">查看详情 ›</span></div>'+
        '<p class="p-desc">'+esc(p.summary)+'</p>'+
        (tags?'<div class="p-tags">'+tags+'</div>':'')+'</a>';
    }
    item.innerHTML='<div class="tl-dot"></div>'+
      '<div class="tl-left"><div class="tl-date">'+esc(t.date)+'</div><h3>'+esc(t.title)+'</h3>'+(t.desc?'<p>'+esc(t.desc)+'</p>':'')+'</div>'+
      '<div class="tl-right">'+right+'</div>';
    $("tlBox").appendChild(item);
  });

  // 联系方式
  const c=d.contact||{};const items=[];
  if(c.email)items.push(["邮箱",c.email,"mailto:"+c.email]);
  if(c.phone)items.push(["电话",c.phone,"tel:"+c.phone]);
  if(c.wechat)items.push(["微信",c.wechat,null]);
  if(c.qq)items.push(["QQ",c.qq,null]);
  
  if(c.github){
    let ghUrl = c.github.trim();
    if(!ghUrl.startsWith("http")) ghUrl = "https://" + ghUrl;
    let ghText = c.github.trim();
    const match = ghText.match(/github\.com\/([^\/\s?#]+)/i);
    ghText = (match && match[1]) ? ("@" + match[1]) : ghText.replace(/^https?:\/\//i, "");
    items.push(["GitHub", ghText, ghUrl]);
  }
  
  if(c.blog){
    let bUrl = c.blog.trim();
    if(!bUrl.startsWith("http")) bUrl = "https://" + bUrl;
    items.push(["博客", c.blog.trim().replace(/^https?:\/\//i, ""), bUrl]);
  }

  if(!items.length)$("contact").style.display="none";
  items.forEach(it=>{
    const div=document.createElement("div");div.className="c-item reveal";
    div.innerHTML='<span class="c-label">'+it[0]+'</span>'+(it[2]?'<a href="'+esc(it[2])+'" target="_blank" title="'+esc(it[1])+'">'+esc(it[1])+'</a>':'<span class="c-val">'+esc(it[1])+'</span>');
    $("contactBox").appendChild(div);
  });

  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}).catch(e=>console.error(e));
</script>
</body>
</html>
