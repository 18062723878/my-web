<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的个人网站</title>
<style>
:root {
  --color-text-primary: #1D1D1F;
  --color-text-secondary: #6E6E73;
  --color-text-tertiary: #86868B;
  --color-bg-primary: #F5F5F7;
  --color-bg-secondary: #FFFFFF;
  --color-accent: #0071E3;
  --header-bg: rgba(245, 245, 247, 0.82);
  --header-border: rgba(0, 0, 0, 0.08);
  --card-border: 1px solid rgba(0, 0, 0, 0.08);
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  --card-hover-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
  
  /* 轮播画廊亮色模式变量 */
  --gallery-card-bg: #FFFFFF;
  --gallery-card-border: 1px solid rgba(0, 0, 0, 0.08);
  --gallery-card-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
  --gallery-card-active-shadow: 0 24px 50px rgba(0, 0, 0, 0.12);
  --capsule-bg: rgba(0, 0, 0, 0.07);
  --capsule-border: 1px solid rgba(0, 0, 0, 0.08);
  --dot-bg: rgba(0, 0, 0, 0.22);
  --dot-active: #1D1D1F;
  --arrow-bg: rgba(255, 255, 255, 0.85);
  --arrow-border: 1px solid rgba(0, 0, 0, 0.1);
  --arrow-color: #1D1D1F;
  --arrow-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);

  --font-display: "SF Pro Display", "PingFang SC", -apple-system, sans-serif;
  --font-text: "SF Pro Text", "PingFang SC", -apple-system, sans-serif;
  --radius-card: 24px;
  --radius-pill: 9999px;
  --ease-apple: cubic-bezier(0.25, 1, 0.5, 1);

  /* 亮色模式下的 Hero 舞台卡片参数 */
  --hero-card-radius: 28px;
  --hero-card-margin: 24px auto;
  --hero-card-shadow: 0 20px 50px rgba(0,0,0,.22), 0 0 40px rgba(0,113,227,.12);
  --hero-card-border: 1px solid rgba(0,0,0,.15);
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-text-primary: #F5F5F7;
    --color-text-secondary: #A1A1A6;
    --color-text-tertiary: #86868B;
    --color-bg-primary: #000000;
    --color-bg-secondary: #161617;
    --color-accent: #2997FF;
    --header-bg: rgba(0, 0, 0, 0.75);
    --header-border: rgba(255, 255, 255, 0.1);
    --card-border: 1px solid rgba(255, 255, 255, 0.12);
    --card-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    --card-hover-shadow: 0 20px 48px rgba(0, 0, 0, 0.85);

    /* 轮播画廊暗色模式变量 */
    --gallery-card-bg: #161617;
    --gallery-card-border: 1px solid rgba(255, 255, 255, 0.14);
    --gallery-card-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    --gallery-card-active-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
    --capsule-bg: rgba(255, 255, 255, 0.12);
    --capsule-border: 1px solid rgba(255, 255, 255, 0.18);
    --dot-bg: rgba(255, 255, 255, 0.35);
    --dot-active: #FFFFFF;
    --arrow-bg: rgba(255, 255, 255, 0.12);
    --arrow-border: 1px solid rgba(255, 255, 255, 0.2);
    --arrow-color: #FFFFFF;
    --arrow-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);

    /* 暗黑模式下 Hero 卡片边缘全幅融入 */
    --hero-card-radius: 0px;
    --hero-card-margin: 0 auto;
    --hero-card-shadow: none;
    --hero-card-border: none;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-text);
  color: var(--color-text-primary);
  background-color: var(--color-bg-primary);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color 400ms ease, color 400ms ease;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 24px;
  background: var(--header-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--header-border);
}
header .logo { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
header nav { display: flex; gap: 20px; }
header nav a {
  color: var(--color-text-secondary);
  text-decoration: none;
  font-size: 14px;
  transition: color 200ms ease;
}
header nav a:hover { color: var(--color-text-primary); }

/* 1. Hero 剧场（保留 Michael 专属背景） */
.hero-wrapper {
  padding: 0 24px;
  max-width: 1200px;
  margin: 0 auto;
}
.hero {
  position: relative;
  min-height: 75vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 24px;
  background-color: #020203;
  border-radius: var(--hero-card-radius);
  margin: var(--hero-card-margin);
  box-shadow: var(--hero-card-shadow);
  border: var(--hero-card-border);
  overflow: hidden;
  transition: all 400ms var(--ease-apple);
}
.hero-bg {
  position: absolute;
  inset: 0;
  background-image: url('mj.jpg'), url('504470-michael-jackson-minimalism-hd-wallpaper-desktop-and-mobile-image-photo%20(1).jpg');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;
  opacity: .78;
  filter: contrast(1.12) brightness(.92);
  pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(2,2,3,0.3) 0%, rgba(2,2,3,0.1) 40%, rgba(2,2,3,0.65) 100%);
  pointer-events: none;
}
.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 760px;
  margin: 0 auto;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(38px, 6vw, 60px);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.025em;
  margin-bottom: 20px;
  color: #FFFFFF !important;
  text-shadow: 0 4px 28px rgba(0,0,0,0.9);
}
.hero p {
  font-size: 21px;
  line-height: 1.45;
  color: rgba(255,255,255,0.88) !important;
  max-width: 620px;
  margin: 0 auto;
  text-shadow: 0 2px 16px rgba(0,0,0,0.9);
}
.hero-actions {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 14px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-accent);
  color: #FFFFFF !important;
  text-decoration: none;
  border-radius: var(--radius-pill);
  padding: 12px 26px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,113,227,0.4);
  transition: transform 200ms ease, opacity 200ms ease;
}
.btn:hover { opacity: .92; }
.btn:active { transform: scale(.98); }

/* 通用板块与版心 */
section {
  max-width: 1040px;
  margin: 0 auto;
  padding: 80px 24px;
}
.sec-head {
  text-align: center;
  margin-bottom: 40px;
}
.sec-tag {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.sec-title {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin-bottom: 8px;
}
.sec-desc {
  font-size: 18px;
  color: var(--color-text-secondary);
}

/* 2. 个人简介 */
.about-card {
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: var(--radius-card);
  padding: 48px 36px;
  text-align: center;
  box-shadow: var(--card-shadow);
  transition: background-color 400ms ease, border-color 400ms ease;
}
.about-text {
  font-size: 20px;
  line-height: 1.65;
  color: var(--color-text-secondary);
  max-width: 720px;
  margin: 0 auto;
  white-space: pre-line;
}

/* 3. 技能与工具 (Bento Grid) */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.skill-card {
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--card-shadow);
  transition: transform 200ms ease, box-shadow 200ms ease, background-color 400ms ease;
}
.skill-card:hover { transform: translateY(-3px); box-shadow: var(--card-hover-shadow); }
.skill-cat {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-accent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.skill-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}
.skill-desc {
  font-size: 13px;
  line-height: 1.5;
  color: var(--color-text-secondary);
}

/* 4. 技术与学习笔记（Apple 居中画廊 + 左右切换箭头） */
section#blogSec {
  max-width: 100vw !important;
  width: 100vw !important;
  margin-left: calc(50% - 50vw) !important;
  margin-right: calc(50% - 50vw) !important;
  padding: 80px 0 !important;
  position: relative;
  overflow: hidden;
}

.gallery-viewport {
  position: relative;
  width: 100%;
  height: 480px;
  overflow: hidden;
  display: flex;
  align-items: center;
}

.gallery-track {
  display: flex;
  gap: 28px;
  will-change: transform;
  transition: transform 0.85s var(--ease-apple);
}

/* 画廊卡片（自动识别亮暗同色） */
.gallery-card {
  flex-shrink: 0;
  width: clamp(320px, 72vw, 840px);
  height: 390px;
  background: var(--gallery-card-bg);
  border: var(--gallery-card-border);
  border-radius: 30px;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  user-select: none;
  cursor: pointer;
  opacity: 0.35;
  transform: scale(0.92);
  color: var(--color-text-primary);
  box-shadow: var(--gallery-card-shadow);
  transition: 
    transform 0.85s var(--ease-apple),
    opacity 0.85s var(--ease-apple),
    box-shadow 0.85s var(--ease-apple),
    background-color 400ms ease,
    border-color 400ms ease;
}

.gallery-card.active {
  opacity: 1;
  transform: scale(1);
  cursor: default;
  box-shadow: var(--gallery-card-active-shadow);
}

.card-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-tag {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-accent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.card-date {
  font-size: 13px;
  color: var(--color-text-tertiary);
  font-weight: 500;
}
.card-body-wrap {
  margin: auto 0;
}
.card-heading {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--color-text-primary);
  margin-bottom: 12px;
}
.card-text {
  font-size: 16px;
  line-height: 1.55;
  color: var(--color-text-secondary);
  max-width: 680px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-link {
  display: inline-flex;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--color-accent);
  text-decoration: none;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.card-link:hover { opacity: 0.8; transform: translateX(3px); }
.card-link.disabled { color: var(--color-text-tertiary); font-weight: 400; cursor: default; }

/* 左右极简切换箭头按钮 */
.arrow-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 15;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--arrow-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: var(--arrow-border);
  color: var(--arrow-color);
  box-shadow: var(--arrow-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 200ms ease, opacity 200ms ease, background-color 400ms ease;
}
.arrow-btn:hover { transform: translateY(-50%) scale(1.08); }
.arrow-btn:active { transform: translateY(-50%) scale(0.95); }
.arrow-btn.prev { left: 32px; }
.arrow-btn.next { right: 32px; }
.arrow-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

/* 底部悬浮毛玻璃胶囊控制条 */
.capsule-controls {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  background: var(--capsule-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: var(--capsule-border);
  border-radius: var(--radius-pill);
  z-index: 10;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
  transition: background-color 400ms ease, border-color 400ms ease;
}
.indicator-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--dot-bg);
  border: none;
  padding: 0;
  cursor: pointer;
  outline: none;
  transition: width 0.5s var(--ease-apple), background-color 0.4s ease;
}
.indicator-dot:hover { opacity: 0.85; }
.indicator-dot.active {
  width: 28px;
  background: var(--dot-active);
}

/* 5. 我的经历与项目时间线 */
.tl { position: relative; max-width: 900px; margin: 0 auto; }
.tl::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: linear-gradient(var(--color-accent), rgba(0,113,227,.12));
}
.tl-item {
  position: relative;
  padding-left: 44px;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1.15fr);
  gap: 24px 64px;
  padding-bottom: 64px;
}
.tl-item.solo { grid-template-columns: 1fr; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute;
  left: 0;
  top: 6px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-accent);
  box-shadow: 0 0 0 4px var(--color-bg-primary);
}
.tl-date { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 4px; letter-spacing: .02em; font-weight: 600; }
.tl-left h3 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.tl-left p { font-size: 16px; line-height: 1.5; color: var(--color-text-secondary); }

.p-card {
  display: block;
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: 20px;
  padding: 24px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--card-shadow);
  transition: transform 300ms var(--ease-apple), box-shadow 300ms var(--ease-apple), background-color 400ms ease;
}
.p-card:hover { transform: scale(1.02); box-shadow: var(--card-hover-shadow); }
.p-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.p-top h4 { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.p-more { color: var(--color-accent); font-size: 14px; white-space: nowrap; font-weight: 500; }
.p-desc { font-size: 14px; line-height: 1.5; color: var(--color-text-secondary); }
.p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag {
  background: var(--color-bg-primary);
  color: var(--color-accent);
  font-size: 12px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}

/* 6. 联系卡片 */
.contact-box {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}
.c-item {
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: 18px;
  padding: 20px;
  text-align: center;
  box-shadow: var(--card-shadow);
  transition: transform 200ms ease, background-color 400ms ease;
}
.c-item:hover { transform: translateY(-3px); }
.c-item .c-label { display: block; font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 6px; font-weight: 500; }
.c-item a { display: block; color: var(--color-text-primary); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.c-item a:hover { color: var(--color-accent); }
.c-item span.c-val { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

/* 7. 页脚（按需求呈现署名） */
footer {
  text-align: center;
  padding: 50px 24px;
  color: var(--color-text-tertiary);
  font-size: 13px;
  border-top: 1px solid var(--header-border);
  transition: background-color 400ms ease;
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 600ms var(--ease-apple), transform 600ms var(--ease-apple);
}
.reveal.in { opacity: 1; transform: none; }

@media (max-width: 768px) {
  .hero-wrapper { padding: 0 12px; }
  .hero { min-height: 65vh; border-radius: 20px; margin: 12px auto; padding: 60px 20px; }
  .hero h1 { font-size: 34px; }
  .hero p { font-size: 17px; }
  .tl-item { grid-template-columns: 1fr; }
  .arrow-btn.prev { left: 12px; }
  .arrow-btn.next { right: 12px; }
  .gallery-card { height: 350px; padding: 24px; border-radius: 24px; }
  .card-heading { font-size: 22px; }
  .card-text { font-size: 14px; }
}
</style>
</head>
<body>

<header>
  <span class="logo" id="siteName">我的个人网站</span>
  <nav>
    <a href="#aboutSec">简介</a>
    <a href="#skillsSec">技能</a>
    <a href="#blogSec">笔记</a>
    <a href="#timelineSec">经历</a>
    <a href="#contact">联系</a>
  </nav>
</header>

<!-- 1. Hero 剧场（Michael Jackson 专属壁纸） -->
<div class="hero-wrapper">
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-inner">
      <h1 id="heroTitle">你好，我是开发者</h1>
      <p id="heroSub">欢迎来到我的个人网站</p>
      <div class="hero-actions" id="heroActions" style="display:none">
        <a class="btn" id="resumeBtn" href="#" target="_blank">预览 / 下载简历</a>
      </div>
    </div>
  </div>
</div>

<!-- 2. 个人简介 -->
<section id="aboutSec">
  <div class="sec-head reveal">
    <div class="sec-tag">About Me</div>
    <h2 class="sec-title">个人简介</h2>
    <p class="sec-desc" id="aboutSub">保持好奇，专注创造价值</p>
  </div>
  <div class="about-card reveal">
    <p class="about-text" id="aboutText">热衷于在设计与工程的交叉点探索，专注构建体验优雅、实用高效的产品与技术实践。</p>
  </div>
</section>

<!-- 3. 技能与工具模块 (Bento Grid) -->
<section id="skillsSec">
  <div class="sec-head reveal">
    <div class="sec-tag">Toolkit</div>
    <h2 class="sec-title">技能与工具</h2>
    <p class="sec-desc">工欲善其事，必先利其器</p>
  </div>
  <div class="skills-grid" id="skillsGrid"></div>
</section>

<!-- 4. 技术与学习笔记模块（Apple 居中画廊 + 左右切换箭头） -->
<section id="blogSec">
  <div class="sec-head reveal">
    <div class="sec-tag">Notes & Articles</div>
    <h2 class="sec-title">技术与学习笔记</h2>
    <p class="sec-desc">记录平时的技术探索、折腾技巧与踩坑日常</p>
  </div>
  <div class="gallery-viewport">
    <button class="arrow-btn prev" id="blogArrowPrev" aria-label="上一张">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="gallery-track" id="blogTrack"></div>
    <button class="arrow-btn next" id="blogArrowNext" aria-label="下一张">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <nav class="capsule-controls" id="blogCapsuleControls" aria-label="笔记导航"></nav>
  </div>
</section>

<!-- 5. 经历与作品时间线模块 -->
<section id="timelineSec">
  <div class="sec-head reveal">
    <div class="sec-tag">Timeline & Projects</div>
    <h2 class="sec-title">我的经历</h2>
    <p class="sec-desc">每一个节点，都对应一个作品</p>
  </div>
  <div class="tl" id="tlBox"></div>
</section>

<!-- 6. 联系方式 -->
<section id="contact">
  <div class="sec-head reveal">
    <div class="sec-tag">Contact</div>
    <h2 class="sec-title">联系我</h2>
    <p class="sec-desc">欢迎随时找我聊聊</p>
  </div>
  <div class="contact-box" id="contactBox"></div>
</section>

<!-- 7. 页脚（包含指定署名） -->
<footer>© <span id="year"></span> • Designed by Michael</footer>

<script>
const $ = id => document.getElementById(id);
function esc(s){ return (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
$("year").textContent = new Date().getFullYear();

// 本地安全回退数据
const DEFAULT_POSTS = [
  {
    tag: "#建站心得",
    date: "2026.09",
    title: "零服务器成本：用 Cloudflare Pages 与 KV 搭建动态个人主页",
    summary: "利用边缘网络托管静态前端，配合 Workers 与 KV 键值存储实现轻量数据持久化与后台鉴权管理，兼顾优雅交互与极简架构。",
    link: ""
  },
  {
    tag: "#前端动效",
    date: "2026.08",
    title: "纯原生实现：仿 Apple 官网居中卡片画廊与毛玻璃胶囊条",
    summary: "深入拆解苹果官网的减速刹车缓动曲线与视口偏移计算逻辑。不依赖复杂第三方库，利用纯原生 CSS 与 JS 打造具备卡片边缘露出与药丸平滑拉伸的轮播交互体验。",
    link: ""
  }
];

// 防强缓存拉取
fetch("/api/data?_t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    const site = d.site || {};
    if(site.name){ document.title = site.name; $("siteName").textContent = site.name; }
    if(site.heroTitle) $("heroTitle").textContent = site.heroTitle;
    if(site.heroSub) $("heroSub").textContent = site.heroSub;
    if(site.about || site.bio) $("aboutText").textContent = site.about || site.bio;
    if(site.aboutSub) $("aboutSub").textContent = site.aboutSub;

    if(site.resumeUrl && site.resumeUrl.trim()){
      $("resumeBtn").href = site.resumeUrl.trim();
      $("heroActions").style.display = "flex";
    }

    // 1. 渲染技能卡片 (Bento Grid)
    const skills = Array.isArray(d.skills) ? d.skills.filter(s => s.name || s.cat) : [];
    if(!skills.length){
      $("skillsSec").style.display = "none";
    } else {
      const skillsGrid = $("skillsGrid");
      skillsGrid.innerHTML = "";
      skills.forEach(s => {
        const div = document.createElement("div");
        div.className = "skill-card reveal";
        div.innerHTML = `
          <div class="skill-cat">${esc(s.cat || "SKILL")}</div>
          <div class="skill-name">${esc(s.name)}</div>
          <div class="skill-desc">${esc(s.desc || "")}</div>
        `;
        skillsGrid.appendChild(div);
      });
    }

    // 2. 渲染技术笔记画廊
    const rawPosts = Array.isArray(d.posts) ? d.posts : [];
    let validPosts = rawPosts.filter(p => p && (
      (p.title && String(p.title).trim()) || 
      (p.summary && String(p.summary).trim()) || 
      (p.tag && String(p.tag).trim())
    ));
    renderBlogGallery(validPosts.length ? validPosts : DEFAULT_POSTS);

    // 3. 渲染时间线与项目卡片
    const ts = (d.timeline || []).filter(t => t.title || t.date);
    if(!ts.length){
      $("timelineSec").style.display = "none";
    } else {
      const tlBox = $("tlBox");
      tlBox.innerHTML = "";
      ts.forEach(t => {
        const p = t.project;
        const hasP = p && (p.title || p.summary);
        const item = document.createElement("div");
        item.className = "tl-item reveal" + (hasP ? "" : " solo");
        let right = "";
        if(hasP){
          const tags = (p.tags || "").split(/[,，]/).map(x => x.trim()).filter(Boolean)
            .map(x => '<span class="tag">' + esc(x) + '</span>').join("");
          right = '<a class="p-card" href="project.html?id=' + encodeURIComponent(p.id || "") + '">' +
            '<div class="p-top"><h4>' + esc(p.title) + '</h4><span class="p-more">查看详情 ›</span></div>' +
            '<p class="p-desc">' + esc(p.summary) + '</p>' +
            (tags ? '<div class="p-tags">' + tags + '</div>' : '') + '</a>';
        }
        item.innerHTML = '<div class="tl-dot"></div>' +
          '<div class="tl-left"><div class="tl-date">' + esc(t.date) + '</div><h3>' + esc(t.title) + '</h3>' + (t.desc ? '<p>' + esc(t.desc) + '</p>' : '') + '</div>' +
          '<div class="tl-right">' + right + '</div>';
        tlBox.appendChild(item);
      });
    }

    // 4. 渲染联系方式
    const c = d.contact || {};
    const items = [];
    if(c.email) items.push(["邮箱", c.email, "mailto:" + c.email]);
    if(c.phone) items.push(["电话", c.phone, "tel:" + c.phone]);
    if(c.wechat) items.push(["微信", c.wechat, null]);
    if(c.qq) items.push(["QQ", c.qq, null]);
    if(c.github){
      let ghUrl = c.github.trim();
      if(!ghUrl.startsWith("http")) ghUrl = "https://" + ghUrl;
      let ghText = c.github.trim().match(/github\.com\/([^\/\s?#]+)/i);
      items.push(["GitHub", ghText ? ("@" + ghText[1]) : c.github.replace(/^https?:\/\//i, ""), ghUrl]);
    }
    if(c.blog){
      let bUrl = c.blog.trim();
      if(!bUrl.startsWith("http")) bUrl = "https://" + bUrl;
      items.push(["博客", c.blog.trim().replace(/^https?:\/\//i, ""), bUrl]);
    }
    const cBox = $("contactBox");
    cBox.innerHTML = "";
    items.forEach(it => {
      const div = document.createElement("div");
      div.className = "c-item reveal";
      div.innerHTML = '<span class="c-label">' + it[0] + '</span>' + (it[2] ? '<a href="' + esc(it[2]) + '" target="_blank">' + esc(it[1]) + '</a>' : '<span class="c-val">' + esc(it[1]) + '</span>');
      cBox.appendChild(div);
    });

    const io = new IntersectionObserver(es => {
      es.forEach(e => {
        if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  })
  .catch(e => {
    console.error(e);
    renderBlogGallery(DEFAULT_POSTS);
  });

// 驱动具备箭头与胶囊的画廊轮播
function renderBlogGallery(posts){
  const track = $("blogTrack");
  const controls = $("blogCapsuleControls");
  const prevBtn = $("blogArrowPrev");
  const nextBtn = $("blogArrowNext");
  if(!track || !controls) return;

  track.innerHTML = "";
  controls.innerHTML = "";

  posts.forEach((p, idx) => {
    const hasLink = p.link && p.link.trim();
    const card = document.createElement("article");
    card.className = "gallery-card" + (idx === 0 ? " active" : "");

    const linkHtml = hasLink 
      ? `<a class="card-link" href="${esc(p.link.trim())}" target="_blank" onclick="event.stopPropagation()">阅读全文 ›</a>`
      : `<span class="card-link disabled">站内笔记</span>`;

    // 智能标题容错机制：防止显示“未命名笔记”
    let titleText = (p.title || "").trim();
    let summaryText = (p.summary || "").trim();
    if(!titleText && summaryText){
      titleText = summaryText;
      summaryText = "个人学习笔记与技术记录。";
    } else if(!titleText && !summaryText){
      titleText = "技术笔记与心得";
      summaryText = "暂无详细介绍，可前往后台管理补充。";
    }

    card.innerHTML = `
      <div class="card-top-bar">
        <span class="card-tag">${esc(p.tag || "#技术笔记")}</span>
        <span class="card-date">${esc(p.date || "")}</span>
      </div>
      <div class="card-body-wrap">
        <h3 class="card-heading">${esc(titleText)}</h3>
        <p class="card-text">${esc(summaryText)}</p>
      </div>
      <div class="card-bottom-bar">
        ${linkHtml}
        <span style="font-size:12px;color:var(--color-text-tertiary);font-family:ui-monospace,sans-serif;">0${idx + 1}</span>
      </div>
    `;
    track.appendChild(card);
  });

  const cards = Array.from(track.querySelectorAll(".gallery-card"));
  let currentIndex = 0;
  const CARD_GAP = 28;

  // 只有 1 张卡片时隐藏控制控件
  if(cards.length <= 1){
    controls.style.display = "none";
    if(prevBtn) prevBtn.style.display = "none";
    if(nextBtn) nextBtn.style.display = "none";
  } else {
    controls.style.display = "flex";
    if(prevBtn) prevBtn.style.display = "flex";
    if(nextBtn) nextBtn.style.display = "flex";

    cards.forEach((_, idx) => {
      const dot = document.createElement("button");
      dot.className = "indicator-dot" + (idx === 0 ? " active" : "");
      dot.setAttribute("aria-label", `跳转至第 ${idx + 1} 篇`);
      dot.addEventListener("click", (e) => {
        e.stopPropagation();
        goToCard(idx);
      });
      controls.appendChild(dot);
    });
  }

  const dots = Array.from(controls.querySelectorAll(".indicator-dot"));

  function goToCard(index){
    if(index < 0 || index >= cards.length) return;
    currentIndex = index;

    const viewportWidth = track.parentElement.offsetWidth || window.innerWidth;
    const cardWidth = cards[0].offsetWidth || Math.min(840, viewportWidth * 0.72);

    // 严谨计算绝对居中偏移量
    const centerOffset = (viewportWidth - cardWidth) / 2;
    const moveDistance = index * (cardWidth + CARD_GAP);
    const targetTransformX = centerOffset - moveDistance;

    track.style.transform = `translateX(${targetTransformX}px)`;

    cards.forEach((c, i) => c.classList.toggle("active", i === index));
    dots.forEach((d, i) => d.classList.toggle("active", i === index));

    // 更新箭头边界透明度
    if(prevBtn && nextBtn && cards.length > 1){
      prevBtn.style.opacity = index === 0 ? "0.3" : "1";
      nextBtn.style.opacity = index === cards.length - 1 ? "0.3" : "1";
    }
  }

  // 左右箭头点击事件
  if(prevBtn && nextBtn){
    prevBtn.onclick = () => goToCard(Math.max(0, currentIndex - 1));
    nextBtn.onclick = () => goToCard(Math.min(cards.length - 1, currentIndex + 1));
  }

  // 点击露出的上一张/下一张卡片直接平滑对齐
  cards.forEach((card, idx) => {
    card.addEventListener("click", (e) => {
      if(e.target.tagName === 'A' || e.target.closest('a')) return;
      if(currentIndex !== idx) goToCard(idx);
    });
  });

  window.addEventListener("resize", () => goToCard(currentIndex));

  // 键盘左右方向键支持
  window.addEventListener("keydown", (e) => {
    const rect = track.getBoundingClientRect();
    if(rect.top < window.innerHeight && rect.bottom > 0){
      if(e.key === "ArrowLeft") goToCard(Math.max(0, currentIndex - 1));
      if(e.key === "ArrowRight") goToCard(Math.min(cards.length - 1, currentIndex + 1));
    }
  });

  // 设备暗色/亮色切换时自适应校准
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      setTimeout(() => goToCard(currentIndex), 100);
    });
  }

  // 多阶段自校准对齐
  requestAnimationFrame(() => goToCard(0));
  setTimeout(() => goToCard(0), 60);
  setTimeout(() => goToCard(0), 300);
}
</script>
</body>
</html>
