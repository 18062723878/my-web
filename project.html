<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目详情</title>
<!-- 引入 html2canvas 实现长图截图导出 -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --color-text-primary:#1D1D1F;--color-text-secondary:#6E6E73;--color-text-tertiary:#86868B;
  --color-bg-primary:#FFFFFF;--color-bg-secondary:#F5F5F7;--color-accent:#0071E3;
  --header-bg:rgba(255,255,255,.8);--header-border:rgba(0,0,0,.06);
  --font-display:"SF Pro Display","PingFang SC",-apple-system,sans-serif;
  --font-text:"SF Pro Text","PingFang SC",-apple-system,sans-serif;
  --space-unit:8px;--space-section:96px;--space-block:64px;--space-element:24px;--space-inline:12px;
  --duration-fast:200ms;--duration-slow:700ms;--ease-default:cubic-bezier(0.25,0.1,0.25,1);
  --radius-button:980px;--radius-card:18px;
}
@media(prefers-color-scheme:dark){
  :root{
    --color-text-primary:#F5F5F7;--color-text-secondary:#A1A1A6;--color-text-tertiary:#86868B;
    --color-bg-primary:#000000;--color-bg-secondary:#161617;--color-accent:#2997FF;
    --header-bg:rgba(0,0,0,.75);--header-border:rgba(255,255,255,.1);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-text);
  color:var(--color-text-primary);
  background:var(--color-bg-primary);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background-color var(--duration-fast),color var(--duration-fast);
}

header{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:var(--space-element);
  padding:0 var(--space-element);
  height:52px;
  background:var(--header-bg);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--header-border);
}
header .back{color:var(--color-accent);text-decoration:none;font-size:14px}
header .logo{font-family:var(--font-display);font-weight:600;font-size:17px}

.wrap{max-width:860px;margin:0 auto;padding:var(--space-section) var(--space-element) var(--space-block)}
.d-hero{text-align:center;margin-bottom:var(--space-block)}
.d-crumb{font-size:12px;color:var(--color-text-tertiary);margin-bottom:var(--space-inline);letter-spacing:.02em}
.d-hero h1{font-family:var(--font-display);font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-bottom:var(--space-inline)}
.d-hero .d-sub{font-size:19px;color:var(--color-text-secondary);max-width:600px;margin:0 auto var(--space-element)}
.d-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-element)}
.tag{background:var(--color-bg-secondary);color:var(--color-accent);font-size:12px;padding:4px 12px;border-radius:var(--radius-button)}
.d-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--space-inline)}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--color-accent);
  color:#fff;
  text-decoration:none;
  border-radius:var(--radius-button);
  padding:12px 24px;
  font-size:15px;
  cursor:pointer;
  border:none;
  transition:transform var(--duration-fast) var(--ease-default),opacity var(--duration-fast);
}
.btn:active{transform:scale(0.98)}
.btn.ghost{background:transparent;color:var(--color-accent);border:1px solid var(--color-accent)}
.btn.secondary{background:var(--color-bg-secondary);color:var(--color-text-primary)}

.d-sec{margin-bottom:var(--space-block)}
.d-sec h2{font-family:var(--font-display);font-size:28px;font-weight:600;margin-bottom:var(--space-element)}
.prose p{margin-bottom:var(--space-element);font-size:17px;line-height:1.6;color:var(--color-text-secondary)}

/* 在线试玩沙盒 (Live Demo Box) */
.demo-box{border-radius:var(--radius-card);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.15);border:1px solid rgba(128,128,128,0.2);background:var(--color-bg-secondary)}
.demo-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(128,128,128,0.08);border-bottom:1px solid rgba(128,128,128,0.15)}
.demo-dots{display:flex;gap:6px}
.demo-dot{width:11px;height:11px;border-radius:50%}
.demo-dot.red{background:#ff5f56}.demo-dot.yellow{background:#ffbd2e}.demo-dot.green{background:#27c93f}
.demo-url-title{font-size:12px;color:var(--color-text-tertiary);font-family:ui-monospace,sans-serif}
.demo-link-btn{font-size:12px;color:var(--color-accent);text-decoration:none}
.demo-frame{width:100%;height:460px;border:none;background:#ffffff;display:block}

/* ===================================================
   Apple Style 代码画廊轮播模块
   =================================================== */
.code-gallery-section{
  width:100vw;
  margin-left:calc(50% - 50vw);
  margin-right:calc(50% - 50vw);
  background:#020203;
  padding:70px 0 80px;
  margin-top:var(--space-block);
  margin-bottom:var(--space-block);
  position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}
.gallery-head{
  max-width:860px;
  margin:0 auto 36px;
  padding:0 var(--space-element);
  text-align:center;
}
.gallery-head .badge-tag{
  display:inline-block;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--color-accent);
  margin-bottom:8px;
}
.gallery-head h2{
  font-family:var(--font-display);
  font-size:36px;
  font-weight:700;
  color:#FFFFFF;
  margin-bottom:10px;
  letter-spacing:-.015em;
}
.gallery-head p{
  font-size:16px;
  color:#86868B;
}

.gallery-viewport{
  position:relative;
  width:100%;
  height:530px;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.gallery-track{
  display:flex;
  gap:28px;
  will-change:transform;
  /* 苹果核心平滑减速刹车曲线 */
  transition:transform 0.85s cubic-bezier(0.25, 1, 0.5, 1);
}

/* 单个代码卡片 */
.code-card{
  flex-shrink:0;
  width:clamp(320px, 75vw, 860px);
  height:460px;
  background:#161618;
  border-radius:24px;
  border:1px solid rgba(255,255,255,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
  opacity:0.35;
  transform:scale(0.92);
  cursor:pointer;
  box-shadow:0 16px 40px rgba(0,0,0,0.5);
  transition:
    transform 0.85s cubic-bezier(0.25, 1, 0.5, 1),
    opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1),
    border-color 0.4s ease,
    box-shadow 0.85s cubic-bezier(0.25, 1, 0.5, 1);
}

.code-card.active{
  opacity:1;
  transform:scale(1);
  cursor:default;
  border-color:rgba(255,255,255,0.22);
  box-shadow:0 24px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
}

/* 卡片顶栏 */
.code-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
  background:rgba(255,255,255,0.03);
  border-bottom:1px solid rgba(255,255,255,0.08);
  flex-shrink:0;
}
.code-card-head .meta{
  display:flex;
  align-items:center;
  gap:12px;
}
.mac-dots{display:flex;gap:6px}
.mac-dot{width:10px;height:10px;border-radius:50%}
.mac-dot.red{background:#ff5f56}.mac-dot.yellow{background:#ffbd2e}.mac-dot.green{background:#27c93f}
.code-card-title{font-size:14px;font-weight:600;color:#F5F5F7}
.code-card-lang{
  font-size:11px;
  text-transform:uppercase;
  padding:2px 8px;
  border-radius:6px;
  background:rgba(255,255,255,0.1);
  color:#A1A1A6;
  font-family:ui-monospace,sans-serif;
}
.card-copy-btn{
  background:rgba(255,255,255,0.08);
  color:#F5F5F7;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:6px;
  padding:5px 12px;
  font-size:12px;
  cursor:pointer;
  transition:background-color 0.2s;
}
.card-copy-btn:hover{background:rgba(255,255,255,0.18)}

/* 代码高亮主体 */
.code-card-body{
  flex:1;
  overflow:auto;
  background:#111113;
  padding:16px 0;
  font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;
}
.cl{display:flex;padding:0 16px}
.ln{flex:0 0 40px;color:#6e6e73;text-align:right;padding-right:14px;user-select:none}
.lc{white-space:pre}
.tk-c{color:#6A9955}.tk-s{color:#CE9178}.tk-k{color:#569CD6}.tk-n{color:#B5CEA8}

/* 底部悬浮胶囊控制条 */
.capsule-controls{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 18px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:9999px;
  z-index:10;
  box-shadow:0 16px 36px rgba(0,0,0,0.5);
}
.indicator-dot{
  width:8px;
  height:8px;
  border-radius:9999px;
  background:rgba(255,255,255,0.35);
  border:none;
  padding:0;
  cursor:pointer;
  outline:none;
  transition:width 0.5s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.4s ease;
}
.indicator-dot:hover{background:rgba(255,255,255,0.65)}
.indicator-dot.active{
  width:28px;
  background:#FFFFFF;
}

.missing{text-align:center;padding:var(--space-section) 20px}
.missing h1{font-size:40px;margin-bottom:var(--space-element)}
.missing p{color:var(--color-text-secondary);margin-bottom:var(--space-element)}
footer{text-align:center;padding:var(--space-block) var(--space-element);background:var(--color-bg-secondary);color:var(--color-text-tertiary);font-size:12px}
@media(max-width:734px){
  .d-hero h1{font-size:34px}
  .wrap{padding-top:var(--space-block)}
  .demo-frame{height:340px}
  .code-card{height:420px}
  .gallery-viewport{height:490px}
}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 返回</a>
  <span class="logo" id="siteName">我的个人网站</span>
</header>
<div class="wrap" id="app"><p style="color:#86868B">加载中…</p></div>
<footer>© <span id="year"></span> · Powered by Cloudflare Pages</footer>

<script>
const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function hl(src){
  var s=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  var re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|&lt;!--[\s\S]*?--&gt;)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(const|let|var|function|return|if|else|for|while|import|from|export|default|class|new|async|await|try|catch|throw|switch|case|break|continue|typeof|true|false|null|undefined|this)\b|(\b\d+(?:\.\d+)?\b)/g;
  return s.replace(re,function(m,c,st,k,n){
    if(c)return '<span class="tk-c">'+c+'</span>';
    if(st)return '<span class="tk-s">'+st+'</span>';
    if(k)return '<span class="tk-k">'+k+'</span>';
    if(n)return '<span class="tk-n">'+n+'</span>';
    return m;
  });
}

let CURRENT_PROJECT_TITLE = "项目详情";
let CODE_CACHE = [];
const q=new URLSearchParams(location.search).get("id");

fetch("/api/data").then(r=>r.json()).then(d=>{
  if(d.site&&d.site.name)$("siteName").textContent=d.site.name;
  var node=null;
  (d.timeline||[]).forEach(t=>{if(t.project&&String(t.project.id)===String(q))node=t});
  if(!node){
    $("app").innerHTML='<div class="missing"><h1>😅 项目不存在</h1><p>它可能已被删除或链接已失效。</p><a class="btn" href="/">返回首页</a></div>';
    return;
  }
  const p=node.project;
  CURRENT_PROJECT_TITLE = p.title || "项目详情";
  document.title=CURRENT_PROJECT_TITLE+" · "+(d.site&&d.site.name||"");
  
  const tags=(p.tags||"").split(/[,，]/).map(x=>x.trim()).filter(Boolean)
    .map(x=>'<span class="tag">'+esc(x)+'</span>').join("");
  const paras=(p.detail||"").split(/\n{2,}/).filter(b=>b.trim())
    .map(b=>"<p>"+esc(b).replace(/\n/g,"<br>")+"</p>").join("");

  // 获取多代码板块
  let blocks = Array.isArray(p.codeBlocks) ? p.codeBlocks.filter(b=>b.code&&b.code.trim()) : [];
  if(!blocks.length && p.code && p.code.trim()){
    blocks = [{ title:"核心实现", lang: p.codeLang||"code", code: p.code }];
  }
  CODE_CACHE = blocks.map(b=>b.code);

  let html='<div class="d-hero">'+
    '<div class="d-crumb">'+esc(node.date)+' · '+esc(node.title)+'</div>'+
    '<h1>'+esc(p.title)+'</h1>'+
    (p.summary?'<p class="d-sub">'+esc(p.summary)+'</p>':'')+
    (tags?'<div class="d-tags">'+tags+'</div>':'')+
    '<div class="d-actions">'+
      (p.link?'<a class="btn" href="'+esc(p.link)+'" target="_blank">访问项目 ↗</a>':'')+
      '<button class="btn secondary" id="snapBtn" onclick="takeScreenshot()">📸 保存为长图</button>'+
      '<a class="btn ghost" href="/">返回首页</a>'+
    '</div></div>';

  if(paras) html+='<div class="d-sec"><h2>项目介绍</h2><div class="prose">'+paras+'</div></div>';

  // 在线试玩沙盒 (Live Demo)
  if(p.demoUrl && p.demoUrl.trim()){
    let dUrl = p.demoUrl.trim();
    if(!dUrl.startsWith("http") && !dUrl.startsWith("/")) dUrl = "https://" + dUrl;
    html+=
      '<div class="d-sec">'+
        '<h2>🎮 在线试玩演示</h2>'+
        '<div class="demo-box">'+
          '<div class="demo-bar">'+
            '<div class="demo-dots"><span class="demo-dot red"></span><span class="demo-dot yellow"></span><span class="demo-dot green"></span></div>'+
            '<span class="demo-url-title">Live Preview</span>'+
            '<a class="demo-link-btn" href="'+esc(dUrl)+'" target="_blank">新标签页打开 ↗</a>'+
          '</div>'+
          '<iframe class="demo-frame" src="'+esc(dUrl)+'" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>'+
        '</div>'+
      '</div>';
  }

  // 融入 Apple 居中 Peek 代码画廊
  if(blocks.length){
    let cardsHtml = "";
    blocks.forEach((b, idx)=>{
      const lines = b.code.replace(/\n$/,"").split("\n");
      const body = lines.map((l,i)=>'<div class="cl"><span class="ln">'+(i+1)+'</span><span class="lc">'+hl(l)+'</span></div>').join("");
      const blockTitle = b.title || ("板块 " + (idx+1));
      const langName = b.lang || "code";

      cardsHtml += `
        <article class="code-card ${idx===0 ? 'active' : ''}">
          <div class="code-card-head">
            <div class="meta">
              <div class="mac-dots">
                <span class="mac-dot red"></span>
                <span class="mac-dot yellow"></span>
                <span class="mac-dot green"></span>
              </div>
              <span class="code-card-title">${esc(blockTitle)}</span>
              <span class="code-card-lang">${esc(langName)}</span>
            </div>
            <button class="card-copy-btn" onclick="copyBlock(${idx}, this)">复制代码</button>
          </div>
          <div class="code-card-body">
            <pre>${body}</pre>
          </div>
        </article>
      `;
    });

    html += `
      <section class="code-gallery-section">
        <div class="gallery-head">
          <span class="badge-tag">Code Architecture</span>
          <h2>核心架构与代码展示</h2>
          <p>左右轻点卡片边缘或通过底部胶囊快速流转</p>
        </div>
        <div class="gallery-viewport">
          <div class="gallery-track" id="galleryTrack">
            ${cardsHtml}
          </div>
          <nav class="capsule-controls" id="capsuleControls" aria-label="代码模块导航"></nav>
        </div>
      </section>
    `;
  }

  $("app").innerHTML=html;

  // 画廊注入 DOM 后初始化轮播交互
  if(blocks.length){
    initCodeGallery();
  }

}).catch(e=>{
  $("app").innerHTML='<div class="missing"><h1>⚠️ 加载失败</h1><p>'+esc(String(e))+'</p><a class="btn" href="/">返回首页</a></div>';
});

// Apple Style 画廊居中与交互控制器
function initCodeGallery(){
  const track = document.getElementById('galleryTrack');
  if(!track) return;
  const cards = Array.from(track.querySelectorAll('.code-card'));
  const controlsContainer = document.getElementById('capsuleControls');
  if(!cards.length || !controlsContainer) return;

  controlsContainer.innerHTML = "";
  let currentIndex = 0;
  const CARD_GAP = 28;

  // 动态创建底部胶囊指示点
  cards.forEach((_, idx)=>{
    const dot = document.createElement('button');
    dot.className = 'indicator-dot' + (idx === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `跳转至板块 ${idx + 1}`);
    dot.addEventListener('click', (e)=>{
      e.stopPropagation();
      goToCard(idx);
    });
    controlsContainer.appendChild(dot);
  });

  const dots = Array.from(controlsContainer.querySelectorAll('.indicator-dot'));

  function goToCard(index){
    if(index < 0 || index >= cards.length) return;
    currentIndex = index;

    const viewportWidth = track.parentElement.offsetWidth;
    const cardWidth = cards[0].offsetWidth;

    // 居中偏移量运算
    const centerOffset = (viewportWidth - cardWidth) / 2;
    const moveDistance = index * (cardWidth + CARD_GAP);
    const targetTransformX = centerOffset - moveDistance;

    track.style.transform = `translateX(${targetTransformX}px)`;

    cards.forEach((c, i)=>{
      c.classList.toggle('active', i === index);
    });

    dots.forEach((d, i)=>{
      d.classList.toggle('active', i === index);
    });
  }

  // 点击 Peek 露出的上一张/下一张卡片直接平滑对齐居中
  cards.forEach((card, idx)=>{
    card.addEventListener('click', ()=>{
      if(currentIndex !== idx){
        goToCard(idx);
      }
    });
  });

  // 视口尺寸调整自适应
  window.removeEventListener('resize', window._galleryResize);
  window._galleryResize = () => goToCard(currentIndex);
  window.addEventListener('resize', window._galleryResize);

  // 键盘左右键支持
  window.removeEventListener('keydown', window._galleryKey);
  window._galleryKey = (e)=>{
    if(e.key === 'ArrowLeft'){
      goToCard(Math.max(0, currentIndex - 1));
    } else if(e.key === 'ArrowRight'){
      goToCard(Math.min(cards.length - 1, currentIndex + 1));
    }
  };
  window.addEventListener('keydown', window._galleryKey);

  // 执行初次居中计算
  requestAnimationFrame(()=>{
    goToCard(0);
  });
}

function copyBlock(idx, btn){
  const code = CODE_CACHE[idx] || "";
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent="已复制 ✓";
    setTimeout(()=>btn.textContent="复制代码",1500);
  });
}

function takeScreenshot(){
  const btn = document.getElementById("snapBtn");
  const origText = btn ? btn.textContent : "";
  if(btn) btn.textContent = "生成中…";

  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const bgColor = isDark ? "#000000" : "#FFFFFF";

  html2canvas(document.body, {
    scale: 2,
    useCORS: true,
    backgroundColor: bgColor,
    windowWidth: document.body.scrollWidth,
    windowHeight: document.body.scrollHeight
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = (CURRENT_PROJECT_TITLE || "项目详情") + "-展示长图.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    if(btn) btn.textContent = origText;
  }).catch(err => {
    alert("生成长图失败：" + err);
    if(btn) btn.textContent = origText;
  });
}
</script>
</body>
</html>
