<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的个人网站</title>
<style>
:root {
  --color-text-primary: #1D1D1F;
  --color-text-secondary: #6E6E73;
  --color-text-tertiary: #86868B;
  --color-bg-primary: #F5F5F7;
  --color-bg-secondary: #FFFFFF;
  --color-accent: #0071E3;
  --header-bg: rgba(245, 245, 247, 0.82);
  --header-border: rgba(0, 0, 0, 0.08);
  --card-border: 1px solid rgba(0, 0, 0, 0.06);
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  --card-hover-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
  --dot-border: #FFFFFF;

  /* 悬浮控制胶囊与箭头 - 亮色 */
  --capsule-bg: rgba(0, 0, 0, 0.06);
  --capsule-border: 1px solid rgba(0, 0, 0, 0.08);
  --dot-bg: rgba(0, 0, 0, 0.25);
  --dot-active: #1D1D1F;
  --arrow-bg: rgba(255, 255, 255, 0.85);
  --arrow-border: 1px solid rgba(0, 0, 0, 0.08);
  --arrow-color: #1D1D1F;

  /* Hero 舞台参数 */
  --hero-card-radius: 28px;
  --hero-card-margin: 24px auto;
  --hero-card-shadow: 0 20px 50px rgba(0,0,0,.22), 0 0 40px rgba(0,113,227,.12);
  --hero-card-border: 1px solid rgba(0,0,0,.15);

  --font-display: "SF Pro Display", "PingFang SC", -apple-system, sans-serif;
  --font-text: "SF Pro Text", "PingFang SC", -apple-system, sans-serif;

  --max-width: 980px;
  --radius-card: 22px;
  --radius-pill: 9999px;
  --ease-apple: cubic-bezier(0.25, 1, 0.5, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-text-primary: #F5F5F7;
    --color-text-secondary: #A1A1A6;
    --color-text-tertiary: #86868B;
    --color-bg-primary: #000000;
    --color-bg-secondary: #161617;
    --color-accent: #2997FF;
    --header-bg: rgba(0, 0, 0, 0.75);
    --header-border: rgba(255, 255, 255, 0.1);
    --card-border: 1px solid rgba(255, 255, 255, 0.1);
    --card-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    --card-hover-shadow: 0 20px 48px rgba(0, 0, 0, 0.85);
    --dot-border: #000000;

    /* 悬浮控制胶囊与箭头 - 暗色同色系 */
    --capsule-bg: rgba(255, 255, 255, 0.12);
    --capsule-border: 1px solid rgba(255, 255, 255, 0.18);
    --dot-bg: rgba(255, 255, 255, 0.35);
    --dot-active: #FFFFFF;
    --arrow-bg: rgba(255, 255, 255, 0.12);
    --arrow-border: 1px solid rgba(255, 255, 255, 0.18);
    --arrow-color: #FFFFFF;

    --hero-card-radius: 0px;
    --hero-card-margin: 0 auto;
    --hero-card-shadow: none;
    --hero-card-border: none;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-text);
  color: var(--color-text-primary);
  background-color: var(--color-bg-primary);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color 400ms ease, color 400ms ease;
}

/* 顶部导航 */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 24px;
  background: var(--header-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--header-border);
}
header .logo { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
header nav { display: flex; gap: 20px; }
header nav a {
  color: var(--color-text-secondary);
  text-decoration: none;
  font-size: 14px;
  transition: color 200ms ease;
}
header nav a:hover { color: var(--color-text-primary); }

/* 1. Michael 剧场卡片 (Hero) */
.hero-wrapper {
  padding: 0 24px;
  max-width: 1200px;
  margin: 0 auto;
}
.hero {
  position: relative;
  min-height: 75vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 24px;
  background-color: #020203;
  border-radius: var(--hero-card-radius);
  margin: var(--hero-card-margin);
  box-shadow: var(--hero-card-shadow);
  border: var(--hero-card-border);
  overflow: hidden;
  transition: all 400ms ease;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background-image: url('mj.jpg'), url('504470-michael-jackson-minimalism-hd-wallpaper-desktop-and-mobile-image-photo%20(1).jpg');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;
  opacity: .78;
  filter: contrast(1.12) brightness(.92);
  pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(2,2,3,0.3) 0%, rgba(2,2,3,0.1) 40%, rgba(2,2,3,0.65) 100%);
  pointer-events: none;
}
.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 760px;
  margin: 0 auto;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(38px, 6vw, 56px);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -.025em;
  margin-bottom: 24px;
  color: #FFFFFF !important;
  text-shadow: 0 4px 28px rgba(0,0,0,0.9);
}
.hero p {
  font-size: 21px;
  line-height: 1.45;
  color: rgba(255,255,255,0.85) !important;
  max-width: 620px;
  margin: 0 auto;
  text-shadow: 0 2px 16px rgba(0,0,0,0.9);
}
.hero-actions {
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 14px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--color-accent);
  color: #FFFFFF !important;
  text-decoration: none;
  border-radius: var(--radius-pill);
  padding: 12px 26px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  box-shadow: 0 4px 20px rgba(0,113,227,0.4);
  transition: transform 200ms ease, opacity 200ms ease;
}
.btn:hover { opacity: .92; }
.btn:active { transform: scale(.98); }

/* 页面通用段落 */
section {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 80px 24px;
}
.section-head {
  text-align: center;
  margin-bottom: 40px;
}
.section-head h2 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -.015em;
  margin-bottom: 10px;
}
.section-head p {
  font-size: 18px;
  color: var(--color-text-secondary);
}

/* 2. 个人简介 */
.about-card {
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: var(--radius-card);
  padding: 48px 32px;
  max-width: 840px;
  margin: 0 auto;
  text-align: center;
  box-shadow: var(--card-shadow);
  transition: background-color 400ms ease;
}
.about-text {
  font-size: 20px;
  line-height: 1.6;
  color: var(--color-text-secondary);
  max-width: 680px;
  margin: 0 auto;
  white-space: pre-line;
}

/* 3. 技能与工具 Bento Grid */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.skill-card {
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: var(--radius-card);
  padding: 24px;
  box-shadow: var(--card-shadow);
  transition: transform 200ms ease, box-shadow 400ms ease, background-color 400ms ease;
}
.skill-card:hover { transform: translateY(-4px); box-shadow: var(--card-hover-shadow); }
.skill-cat { font-size: 12px; color: var(--color-accent); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
.skill-name { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.skill-desc { font-size: 14px; line-height: 1.5; color: var(--color-text-secondary); }

/* ===================================================
   4. 技术与学习笔记：Apple 居中画廊 + 箭头控制器
   =================================================== */
section#blogSec {
  max-width: 100vw !important;
  width: 100vw !important;
  margin-left: calc(50% - 50vw) !important;
  margin-right: calc(50% - 50vw) !important;
  padding: 80px 0 !important;
  position: relative;
  overflow: hidden;
}
.blog-head-inner {
  max-width: var(--max-width);
  margin: 0 auto 36px;
  padding: 0 24px;
  text-align: center;
}
.blog-head-inner h2 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -.015em;
  margin-bottom: 10px;
}
.blog-head-inner p {
  font-size: 18px;
  color: var(--color-text-secondary);
}

.blog-viewport {
  position: relative;
  width: 100%;
  height: 480px;
  overflow: hidden;
  display: flex;
  align-items: center;
}
.blog-track {
  display: flex;
  gap: 28px;
  will-change: transform;
  transition: transform 0.85s var(--ease-apple);
}

/* 博客大卡片 */
.blog-card {
  flex-shrink: 0;
  width: clamp(320px, 72vw, 840px);
  height: 380px;
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: 30px;
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  user-select: none;
  cursor: pointer;
  opacity: 0.35;
  transform: scale(0.92);
  box-shadow: var(--card-shadow);
  transition: 
    transform 0.85s var(--ease-apple),
    opacity 0.85s var(--ease-apple),
    box-shadow 0.85s var(--ease-apple),
    background-color 400ms ease;
}
.blog-card.active {
  opacity: 1;
  transform: scale(1);
  cursor: default;
  box-shadow: var(--card-hover-shadow);
}
.blog-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.blog-card-tag {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-accent);
  text-transform: uppercase;
}
.blog-card-date {
  font-size: 13px;
  color: var(--color-text-tertiary);
  font-weight: 500;
}
.blog-card-body {
  margin: auto 0;
}
.blog-card-title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.02em;
  margin-bottom: 12px;
}
.blog-card-desc {
  font-size: 16px;
  line-height: 1.55;
  color: var(--color-text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.blog-card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.blog-card-link {
  font-size: 15px;
  font-weight: 600;
  color: var(--color-accent);
  text-decoration: none;
  transition: transform 0.2s;
}
.blog-card-link:hover { transform: translateX(3px); }
.blog-card-link.disabled { color: var(--color-text-tertiary); cursor: default; }

/* 左右轻量切换箭头 */
.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--arrow-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: var(--arrow-border);
  color: var(--arrow-color);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 15;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  transition: transform 0.25s var(--ease-apple), background-color 0.25s;
}
.gallery-arrow:hover {
  transform: translateY(-50%) scale(1.1);
}
.gallery-arrow:active {
  transform: translateY(-50%) scale(0.95);
}
.gallery-arrow.prev { left: 28px; }
.gallery-arrow.next { right: 28px; }
.gallery-arrow svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 底部悬浮毛玻璃胶囊控制条 */
.capsule-controls {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  background: var(--capsule-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: var(--capsule-border);
  border-radius: var(--radius-pill);
  z-index: 10;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
}
.indicator-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--dot-bg);
  border: none;
  cursor: pointer;
  outline: none;
  transition: width 0.5s var(--ease-apple), background-color 0.4s ease;
}
.indicator-dot.active {
  width: 28px;
  background: var(--dot-active);
}

/* 5. 时间线 + 项目卡片 */
.tl { position: relative; max-width: 900px; margin: 0 auto; }
.tl::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: linear-gradient(var(--color-accent), rgba(0,113,227,.12));
}
.tl-item {
  position: relative;
  padding-left: 44px;
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1.15fr);
  gap: 24px 64px;
  padding-bottom: 64px;
}
.tl-item.solo { grid-template-columns: 1fr; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute;
  left: 0;
  top: 6px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-accent);
  border: 3px solid var(--dot-border);
  box-shadow: 0 0 0 2px var(--color-accent);
}
.tl-date { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 4px; }
.tl-left h3 { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-bottom: 6px; }
.tl-left p { font-size: 16px; line-height: 1.5; color: var(--color-text-secondary); }
.p-card {
  display: block;
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: var(--radius-card);
  padding: 24px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--card-shadow);
  transition: transform 300ms var(--ease-apple), box-shadow 300ms var(--ease-apple);
}
.p-card:hover { transform: scale(1.02); box-shadow: var(--card-hover-shadow); }
.p-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.p-top h4 { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.p-more { color: var(--color-accent); font-size: 14px; }
.p-desc { font-size: 14px; line-height: 1.5; color: var(--color-text-secondary); }
.p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { background: var(--color-bg-primary); color: var(--color-accent); font-size: 12px; padding: 4px 10px; border-radius: var(--radius-pill); }

/* 6. 联系卡片 */
.contact-box {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  max-width: 840px;
  margin: 0 auto;
}
.c-item {
  background: var(--color-bg-secondary);
  border: var(--card-border);
  border-radius: var(--radius-card);
  padding: 20px;
  text-align: center;
  box-shadow: var(--card-shadow);
  transition: transform 200ms ease;
}
.c-item:hover { transform: translateY(-3px); }
.c-item .c-label { display: block; font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 6px; }
.c-item a { color: var(--color-text-primary); text-decoration: none; word-break: break-all; }
.c-item a:hover { color: var(--color-accent); }

footer {
  text-align: center;
  padding: 48px 24px;
  background: var(--color-bg-secondary);
  color: var(--color-text-tertiary);
  font-size: 13px;
  border-top: 1px solid var(--header-border);
  transition: background-color 400ms ease;
}

.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 600ms var(--ease-apple), transform 600ms var(--ease-apple);
}
.reveal.in {
  opacity: 1;
  transform: none;
}

@media (max-width: 768px) {
  .hero-wrapper { padding: 0 12px; }
  .hero { min-height: 68vh; padding: 60px 20px; border-radius: 20px; margin: 12px auto; }
  .hero h1 { font-size: 34px; }
  .tl-item { grid-template-columns: 1fr; }
  .gallery-arrow { display: none; } /* 移动端靠左右手势滑动手感更佳 */
  .blog-card { height: 350px; padding: 24px 20px; border-radius: 22px; }
  .blog-card-title { font-size: 22px; }
  .blog-viewport { height: 420px; }
}
</style>
</head>
<body>

<header>
  <span class="logo" id="siteName">我的个人网站</span>
  <nav>
    <a href="#aboutSec">简介</a>
    <a href="#skillsSec">技能</a>
    <a href="#blogSec">笔记</a>
    <a href="#timelineSec">经历</a>
    <a href="#contact">联系</a>
  </nav>
</header>

<!-- 1. Hero 剧场（保留 Michael 经典背景图） -->
<div class="hero-wrapper">
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-inner">
      <h1 id="heroTitle"></h1>
      <p id="heroSub"></p>
      <div class="hero-actions" id="heroActions" style="display:none">
        <a class="btn" id="resumeBtn" href="#" target="_blank">预览 / 下载简历</a>
      </div>
    </div>
  </div>
</div>

<!-- 2. 个人简介 -->
<section id="aboutSec">
  <div class="section-head reveal">
    <h2>个人简介</h2>
    <p id="aboutSub">保持好奇，专注创造价值</p>
  </div>
  <div class="about-card reveal">
    <p class="about-text" id="aboutText">热衷于在设计与工程的交叉点探索，专注构建体验优雅、实用高效的产品与技术实践。</p>
  </div>
</section>

<!-- 3. 技能与工具模块 -->
<section id="skillsSec">
  <div class="section-head reveal">
    <h2>技能与工具</h2>
    <p>工欲善其事，必先利其器</p>
  </div>
  <div class="skills-grid" id="skillsGrid"></div>
</section>

<!-- 4. 技术与学习笔记（居中卡片画廊 + 箭头控制） -->
<section id="blogSec">
  <div class="blog-head-inner reveal">
    <h2>技术与学习笔记</h2>
    <p>记录平时的技术探索、折腾技巧与踩坑日常</p>
  </div>
  <div class="blog-viewport">
    <!-- 左箭头 -->
    <button class="gallery-arrow prev" id="blogPrevBtn" aria-label="上一篇">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    
    <!-- 卡片轨道 -->
    <div class="blog-track" id="blogTrack"></div>
    
    <!-- 右箭头 -->
    <button class="gallery-arrow next" id="blogNextBtn" aria-label="下一篇">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>

    <!-- 底部悬浮胶囊 -->
    <nav class="capsule-controls" id="blogCapsuleControls" aria-label="技术笔记导航"></nav>
  </div>
</section>

<!-- 5. 经历与项目模块 -->
<section id="timelineSec">
  <div class="section-head reveal">
    <h2>我的经历</h2>
    <p>每一个节点，都对应一个作品</p>
  </div>
  <div class="tl" id="tlBox"></div>
</section>

<!-- 6. 联系方式 -->
<section id="contact">
  <div class="section-head reveal">
    <h2>联系我</h2>
    <p>欢迎随时找我聊聊</p>
  </div>
  <div class="contact-box" id="contactBox"></div>
</section>

<!-- 7. 页脚 -->
<footer>© <span id="year"></span> · Designed by Michael</footer>

<script>
const $ = id => document.getElementById(id);
function esc(s){ return (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
$("year").textContent = new Date().getFullYear();

// 默认兜底展示数据
const DEFAULT_POSTS = [
  {
    tag: "#建站心得",
    date: "2026.09",
    title: "零服务器成本：用 Cloudflare Pages 与 KV 搭建动态个人主页",
    summary: "利用边缘网络托管静态前端，配合 Workers 与 KV 键值存储实现轻量数据持久化与后台鉴权管理，兼顾优雅交互与极简架构。",
    link: ""
  },
  {
    tag: "#前端动效",
    date: "2026.08",
    title: "纯原生实现：仿 Apple 官网居中卡片画廊与毛玻璃胶囊条",
    summary: "深入拆解苹果官网的减速刹车缓动曲线与视口偏移计算逻辑。不依赖复杂第三方库，利用纯原生 CSS 与 JS 打造轮播交互体验。",
    link: ""
  },
  {
    tag: "#学习笔记",
    date: "2026.07",
    title: "大一新生自学 C 语言：从控制流到指针内存初探",
    summary: "整理 C 语言核心语法的学习心得与基础算法练习。从标准输入输出缓冲区清洗、函数栈设计，到指针变量与数组内存布局，记录由浅入深夯实计算机底层素养的思考过程。",
    link: ""
  }
];

fetch("/api/data?_t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    const site = d.site || {};
    if(site.name){ document.title = site.name; $("siteName").textContent = site.name; }
    $("heroTitle").textContent = site.heroTitle || "你好，我是开发者";
    $("heroSub").textContent = site.heroSub || "欢迎来到我的个人网站";

    if(site.resumeUrl && site.resumeUrl.trim()){
      $("resumeBtn").href = site.resumeUrl.trim();
      $("heroActions").style.display = "flex";
    }

    if(site.about || site.bio) $("aboutText").textContent = site.about || site.bio;
    if(site.aboutSub) $("aboutSub").textContent = site.aboutSub;

    // 渲染技能卡片
    const skills = Array.isArray(d.skills) ? d.skills.filter(s => s.name || s.cat) : [];
    if(!skills.length){
      $("skillsSec").style.display = "none";
    } else {
      const skillsGrid = $("skillsGrid");
      skillsGrid.innerHTML = "";
      skills.forEach(s => {
        const div = document.createElement("div");
        div.className = "skill-card reveal";
        div.innerHTML = `
          <div class="skill-cat">${esc(s.cat || "技能")}</div>
          <div class="skill-name">${esc(s.name)}</div>
          <div class="skill-desc">${esc(s.desc || "")}</div>
        `;
        skillsGrid.appendChild(div);
      });
    }

    // 渲染技术笔记（画廊）
    const rawPosts = Array.isArray(d.posts) ? d.posts : [];
    let validPosts = rawPosts.filter(p => p && (
      (p.title && String(p.title).trim()) || 
      (p.summary && String(p.summary).trim()) || 
      (p.tag && String(p.tag).trim())
    ));
    renderBlogGallery(validPosts.length ? validPosts : DEFAULT_POSTS);

    // 渲染时间线与项目卡片（联动 project.html）
    const ts = (d.timeline || []).filter(t => t.title || t.date);
    if(!ts.length){
      $("timelineSec").style.display = "none";
    } else {
      const tlBox = $("tlBox");
      tlBox.innerHTML = "";
      ts.forEach(t => {
        const p = t.project;
        const hasP = p && (p.title || p.summary);
        const item = document.createElement("div");
        item.className = "tl-item reveal" + (hasP ? "" : " solo");
        let right = "";
        if(hasP){
          const tags = (p.tags || "").split(/[,，]/).map(x => x.trim()).filter(Boolean)
            .map(x => `<span class="tag">${esc(x)}</span>`).join("");
          right = `
            <a class="p-card" href="project.html?id=${encodeURIComponent(p.id || "")}">
              <div class="p-top"><h4>${esc(p.title)}</h4><span class="p-more">查看详情 ›</span></div>
              <p class="p-desc">${esc(p.summary || "")}</p>
              ${tags ? `<div class="p-tags">${tags}</div>` : ""}
            </a>
          `;
        }
        item.innerHTML = `
          <div class="tl-dot"></div>
          <div class="tl-left">
            <div class="tl-date">${esc(t.date)}</div>
            <h3>${esc(t.title)}</h3>
            ${t.desc ? `<p>${esc(t.desc)}</p>` : ""}
          </div>
          <div class="tl-right">${right}</div>
        `;
        tlBox.appendChild(item);
      });
    }

    // 渲染联系方式
    const c = d.contact || {};
    const items = [];
    if(c.email) items.push(["邮箱", c.email, "mailto:" + c.email]);
    if(c.phone) items.push(["电话", c.phone, "tel:" + c.phone]);
    if(c.wechat) items.push(["微信", c.wechat, null]);
    if(c.qq) items.push(["QQ", c.qq, null]);
    if(c.github){
      let gh = c.github.trim();
      items.push(["GitHub", gh.replace(/^https?:\/\//i, ""), gh.startsWith("http") ? gh : "https://" + gh]);
    }
    if(c.blog){
      let bg = c.blog.trim();
      items.push(["博客", bg.replace(/^https?:\/\//i, ""), bg.startsWith("http") ? bg : "https://" + bg]);
    }

    const contactBox = $("contactBox");
    contactBox.innerHTML = "";
    items.forEach(it => {
      const div = document.createElement("div");
      div.className = "c-item reveal";
      div.innerHTML = `<span class="c-label">${esc(it[0])}</span>` + 
        (it[2] ? `<a href="${esc(it[2])}" target="_blank">${esc(it[1])}</a>` : `<span>${esc(it[1])}</span>`);
      contactBox.appendChild(div);
    });

    const io = new IntersectionObserver(es => {
      es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  })
  .catch(e => {
    console.error(e);
    renderBlogGallery(DEFAULT_POSTS);
  });

// 渲染居中画廊与双向交互控制
function renderBlogGallery(posts){
  const track = $("blogTrack");
  const controls = $("blogCapsuleControls");
  const prevBtn = $("blogPrevBtn");
  const nextBtn = $("blogNextBtn");
  if(!track || !controls) return;

  track.innerHTML = "";
  controls.innerHTML = "";

  posts.forEach((p, idx) => {
    const hasLink = p.link && p.link.trim();
    const card = document.createElement("article");
    card.className = "blog-card" + (idx === 0 ? " active" : "");

    // 智能标题填充：避免留空出现“未命名笔记”
    let title = (p.title && p.title.trim()) || "";
    let summary = (p.summary && p.summary.trim()) || "";
    if(!title && summary){
      title = summary;
      summary = "";
    } else if(!title && !summary){
      title = "技术与学习笔记";
    }

    const linkHtml = hasLink 
      ? `<a class="blog-card-link" href="${esc(p.link.trim())}" target="_blank" onclick="event.stopPropagation()">阅读全文 ›</a>`
      : `<span class="blog-card-link disabled">站内笔记</span>`;

    card.innerHTML = `
      <div class="blog-card-top">
        <span class="blog-card-tag">${esc(p.tag || "#技术笔记")}</span>
        <span class="blog-card-date">${esc(p.date || "")}</span>
      </div>
      <div class="blog-card-body">
        <h3 class="blog-card-title">${esc(title)}</h3>
        <p class="blog-card-desc">${esc(summary || "暂无简要介绍，可随时在管理后台中补充。")}</p>
      </div>
      <div class="blog-card-bottom">
        ${linkHtml}
        <span style="font-size:12px;color:var(--color-text-tertiary);font-family:ui-monospace,sans-serif;">0${idx + 1}</span>
      </div>
    `;
    track.appendChild(card);
  });

  const cards = Array.from(track.querySelectorAll(".blog-card"));
  let currentIndex = 0;

  // 动态创建指示点
  cards.forEach((_, idx) => {
    const dot = document.createElement("button");
    dot.className = "indicator-dot" + (idx === 0 ? " active" : "");
    dot.setAttribute("aria-label", `跳转至第 ${idx + 1} 篇`);
    dot.addEventListener("click", (e) => {
      e.stopPropagation();
      goToCard(idx);
    });
    controls.appendChild(dot);
  });

  const dots = Array.from(controls.querySelectorAll(".indicator-dot"));

  // 基于 offsetLeft 的居中公式，解决单张卡片或首张卡片偏移不居中的问题
  function goToCard(index){
    if(!cards.length) return;
    if(index < 0) index = cards.length - 1; // 循环切换
    if(index >= cards.length) index = 0;
    currentIndex = index;

    const viewport = track.parentElement;
    const viewportWidth = viewport.offsetWidth || window.innerWidth;
    const targetCard = cards[index];
    const cardWidth = targetCard.offsetWidth || Math.min(840, viewportWidth * 0.72);
    const cardLeft = targetCard.offsetLeft;

    const targetTransformX = (viewportWidth - cardWidth) / 2 - cardLeft;
    track.style.transform = `translateX(${targetTransformX}px)`;

    cards.forEach((c, i) => c.classList.toggle("active", i === index));
    dots.forEach((d, i) => d.classList.toggle("active", i === index));
  }

  // 箭头点击事件绑定
  if(prevBtn && nextBtn){
    prevBtn.onclick = (e) => { e.stopPropagation(); goToCard(currentIndex - 1); };
    nextBtn.onclick = (e) => { e.stopPropagation(); goToCard(currentIndex + 1); };
  }

  // 点击侧边露出的卡片直接居中
  cards.forEach((card, idx) => {
    card.addEventListener("click", (e) => {
      if(e.target.tagName === 'A' || e.target.closest('a')) return;
      if(currentIndex !== idx) goToCard(idx);
    });
  });

  window.addEventListener("resize", () => goToCard(currentIndex));

  // 键盘左右方向键支持
  window.addEventListener("keydown", (e) => {
    const rect = track.getBoundingClientRect();
    if(rect.top < window.innerHeight && rect.bottom > 0){
      if(e.key === "ArrowLeft") goToCard(currentIndex - 1);
      if(e.key === "ArrowRight") goToCard(currentIndex + 1);
    }
  });

  // 连续帧对齐校准，确保任何网速与分辨率下都能完成居中运算
  requestAnimationFrame(() => goToCard(0));
  setTimeout(() => goToCard(0), 80);
  setTimeout(() => goToCard(0), 300);
}
</script>
