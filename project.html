<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线代码编辑器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .editor-card {
            width: 100%;
            max-width: 800px;
            background: #181825;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #313244;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #11111b;
            border-bottom: 1px solid #313244;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select {
            background: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .run-btn {
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .run-btn:hover {
            opacity: 0.9;
        }

        .run-btn:active {
            transform: scale(0.98);
        }

        /* 隐藏运行按钮的样式类 */
        .hidden {
            display: none !important;
        }

        .status-tip {
            font-size: 13px;
            color: #f38ba8;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #181825;
            color: #cdd6f4;
            border: none;
            padding: 16px;
            font-family: "Fira Code", Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        .output-panel {
            padding: 12px 16px;
            background: #11111b;
            border-top: 1px solid #313244;
            font-family: monospace;
            font-size: 13px;
            min-height: 60px;
            color: #bac2de;
        }
    </style>
</head>
<body>

<div class="editor-card">
    <div class="toolbar">
        <div class="controls">
            <label for="languageSelect">语言环境：</label>
            <select id="languageSelect">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="c">C 语言</option>
            </select>
            <span id="langNotice" class="status-tip"></span>
        </div>
        <button id="runBtn" class="run-btn">运行代码</button>
    </div>

    <textarea id="codeEditor" spellcheck="false" placeholder="在此输入代码..."></textarea>
    
    <div class="output-panel" id="outputPanel">
        控制台输出区域...
    </div>
</div>

<script>
    const codeEditor = document.getElementById('codeEditor');
    const languageSelect = document.getElementById('languageSelect');
    const runBtn = document.getElementById('runBtn');
    const langNotice = document.getElementById('langNotice');
    const outputPanel = document.getElementById('outputPanel');

    // 默认示例模板
    const templates = {
        python: 'name = "World"\nprint(f"Hello, {name}!")',
        javascript: 'const name = "World";\nconsole.log(`Hello, ${name}!`);',
        c: '#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}'
    };

    // 初始化默认代码
    codeEditor.value = templates[languageSelect.value];

    // 检测语言并更新按钮状态
    function updateRunnerVisibility() {
        const selectedLang = languageSelect.value;
        const codeText = codeEditor.value;

        // 判定条件：选择器选中 C 语言，或者代码中包含典型 C 语言特征
        const isCBySelection = (selectedLang === 'c');
        const isCByContent = /#include\s*<stdio\.h>|int\s+main\s*\(/.test(codeText);

        if (isCBySelection || isCByContent) {
            runBtn.classList.add('hidden');
            langNotice.textContent = '检测到 C 语言，当前环境不支持直接运行';
        } else {
            runBtn.classList.remove('hidden');
            langNotice.textContent = '';
        }
    }

    // 切换下拉菜单
    languageSelect.addEventListener('change', () => {
        codeEditor.value = templates[languageSelect.value] || '';
        updateRunnerVisibility();
        outputPanel.textContent = '控制台输出区域...';
    });

    // 实时监听输入，自动识别 C 语言特征
    codeEditor.addEventListener('input', updateRunnerVisibility);

    // 模拟运行动作（针对 JS / Python）
    runBtn.addEventListener('click', () => {
        const lang = languageSelect.value;
        outputPanel.textContent = `[系统] 正在执行 ${lang.toUpperCase()} 代码...\n`;

        if (lang === 'javascript') {
            try {
                // 仅作为简易本地模拟演示
                const originalLog = console.log;
                let logs = [];
                console.log = (...args) => logs.push(args.join(' '));
                new Function(codeEditor.value)();
                console.log = originalLog;
                outputPanel.textContent = logs.join('\n') || '[执行完毕，无输出]';
            } catch (err) {
                outputPanel.textContent = `执行错误: ${err.message}`;
            }
        } else {
            outputPanel.textContent = `[提示] 当前处于 ${lang} 运行模式。`;
        }
    });

    // 页面初次加载时检查状态
    updateRunnerVisibility();
</script>

</body>
</html>
