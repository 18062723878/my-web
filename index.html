<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的个人网站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#f7f8fa;color:#222}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 1px 6px rgba(0,0,0,.06)}
header .logo{font-weight:800;font-size:17px}
header nav{margin-left:auto;display:flex;gap:18px}
header nav a{color:#555;text-decoration:none;font-size:14px}
.hero{padding:90px 20px;text-align:center;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.hero h1{font-size:40px;margin-bottom:14px}
.hero p{font-size:17px;opacity:.92;max-width:640px;margin:0 auto;line-height:1.7}
section{max-width:960px;margin:0 auto;padding:56px 20px 20px}
section h2{font-size:24px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.p-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-top h3{font-size:17px}
.p-time{font-size:12px;color:#888;white-space:nowrap}
.p-desc{font-size:14px;color:#555;line-height:1.7}
.p-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#eef2ff;color:#4f6ef7;font-size:12px;padding:3px 10px;border-radius:99px}
.p-link{color:#4f6ef7;text-decoration:none;font-size:14px;font-weight:600}
.tl{border-left:3px solid #dfe3ea;margin-left:8px;padding-left:26px;display:flex;flex-direction:column;gap:24px}
.tl-item{position:relative}
.tl-dot{position:absolute;left:-34px;top:4px;width:13px;height:13px;border-radius:50%;background:#4f6ef7;border:3px solid #fff;box-shadow:0 0 0 2px #4f6ef7}
.tl-date{font-size:13px;color:#888;margin-bottom:4px}
.tl-item h3{font-size:16px;margin-bottom:4px}
.tl-item p{font-size:14px;color:#555;line-height:1.6}
.contact-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.c-item{background:#fff;border-radius:10px;padding:14px 16px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.c-item a{color:#222;text-decoration:none}
.c-item a:hover{color:#4f6ef7}
footer{text-align:center;padding:36px;color:#999;font-size:13px}
</style>
</head>
<body>
<header>
  <span class="logo" id="siteName">我的个人网站</span>
  <nav>
    <a href="#projects">项目</a>
    <a href="#timelineSec">时间线</a>
    <a href="#contact">联系</a>
  </nav>
</header>

<div class="hero">
  <h1 id="heroTitle"></h1>
  <p id="heroSub"></p>
</div>

<section id="projects"><h2>📁 我的项目</h2><div class="grid" id="projectGrid"></div></section>
<section id="timelineSec"><h2>🕐 我的经历</h2><div class="tl" id="tlBox"></div></section>
<section id="contact"><h2>📮 联系我</h2><div class="contact-box" id="contactBox"></div></section>

<footer>© <span id="year"></span> · Powered by Cloudflare Pages</footer>

<script>
const $=id=>document.getElementById(id);
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
$("year").textContent=new Date().getFullYear();

fetch("/api/data").then(r=>r.json()).then(d=>{
  const site=d.site||{};
  if(site.name){document.title=site.name;$("siteName").textContent=site.name}
  $("heroTitle").textContent=site.heroTitle||"";
  $("heroSub").textContent=site.heroSub||"";

  const ps=(d.projects||[]).filter(p=>p.title||p.desc);
  if(!ps.length)$("projects").style.display="none";
  ps.forEach(p=>{
    const tags=(p.tags||"").split(/[,，]/).map(t=>t.trim()).filter(Boolean)
      .map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
    const card=document.createElement("div");card.className="p-card";
    card.innerHTML=
      '<div class="p-top"><h3>'+esc(p.title)+'</h3><span class="p-time">'+esc(p.time)+'</span></div>'+
      '<p class="p-desc">'+esc(p.desc)+'</p>'+
      (tags?'<div class="p-tags">'+tags+'</div>':'')+
      (p.link?'<a class="p-link" href="'+esc(p.link)+'" target="_blank">查看项目 →</a>':'');
    $("projectGrid").appendChild(card);
  });

  const ts=(d.timeline||[]).filter(t=>t.title||t.date);
  if(!ts.length)$("timelineSec").style.display="none";
  ts.forEach(t=>{
    const item=document.createElement("div");item.className="tl-item";
    item.innerHTML='<div class="tl-dot"></div><div class="tl-date">'+esc(t.date)+'</div><h3>'+esc(t.title)+'</h3>'+(t.desc?'<p>'+esc(t.desc)+'</p>':'');
    $("tlBox").appendChild(item);
  });

  const c=d.contact||{};const items=[];
  if(c.email)items.push(["📧","邮箱",c.email,"mailto:"+c.email]);
  if(c.phone)items.push(["📱","电话",c.phone,"tel:"+c.phone]);
  if(c.wechat)items.push(["💬","微信",c.wechat,null]);
  if(c.qq)items.push(["🐧","QQ",c.qq,null]);
  if(c.github)items.push(["🐙","GitHub",c.github,c.github]);
  if(c.blog)items.push(["🌐","博客",c.blog,c.blog]);
  if(!items.length)$("contact").style.display="none";
  items.forEach(it=>{
    const div=document.createElement("div");div.className="c-item";
    div.innerHTML=it[3]?'<a href="'+esc(it[3])+'" target="_blank">'+it[0]+' '+it[1]+'：'+esc(it[2])+'</a>':it[0]+' '+it[1]+'：'+esc(it[2]);
    $("contactBox").appendChild(div);
  });
}).catch(e=>console.error(e));
</script>
</body>
</html>
