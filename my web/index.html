<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Michael — Full-Stack Architect</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<style>
:root{
  --font:"SF Pro Display","SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --dur:.35s;
  --pad-x:clamp(24px,5vw,80px);
  --section-y:clamp(80px,12vh,160px);
  --hero-size:clamp(44px,7.5vw,80px);
  --h2-size:clamp(32px,4.2vw,56px);
  --body-size:17px;
  --small:14px;
  --kicker:13px;
  --blue:#0071E3;
  --blue-hover:#0077ED;
  --link:#0066CC;
  --parallax-glyph:40px;
}
html[data-theme="light"]{
  --bg:#fff;--bg-warm:#FAFAFC;--text:#1D1D1F;--text-sub:#6E6E73;
  --text-ter:#86868B;--hairline:rgba(0,0,0,.08);--card-bg:#F5F5F7;
  --nav-bg:rgba(255,255,255,.72);
}
html[data-theme="dark"]{
  --bg:#161617;--bg-warm:#101012;--text:#F5F5F7;--text-sub:#A1A1A6;
  --text-ter:#86868B;--hairline:rgba(255,255,255,.1);--card-bg:#1C1C1E;
  --nav-bg:rgba(22,22,23,.72);--blue:#2997FF;--blue-hover:#40A4FF;--link:#2997FF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--body-size);
  line-height:1.47;letter-spacing:-.374px;overflow-x:hidden;
  transition:background .5s var(--ease),color .5s var(--ease);-webkit-font-smoothing:antialiased}
::selection{background:var(--blue);color:#fff}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;height:48px;display:flex;align-items:center;
  justify-content:center;gap:clamp(20px,4vw,48px);padding:0 var(--pad-x);
  background:var(--nav-bg);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hairline)}
.nav-logo{position:absolute;left:var(--pad-x);font-size:17px;font-weight:600}
.nav-links{display:flex;gap:clamp(18px,3vw,40px)}
.nav-links a{font-size:var(--small);color:var(--text-sub);transition:color var(--dur)}
.nav-links a:hover{color:var(--text)}
.theme-btn{position:absolute;right:var(--pad-x);width:30px;height:30px;border:none;background:none;
  cursor:pointer;font-size:15px;color:var(--text-sub);border-radius:50%;transition:color var(--dur)}
.theme-btn:hover{color:var(--text)}

.band{position:relative;width:100%;padding:var(--section-y) var(--pad-x);overflow:hidden}
.band--white{background:var(--bg)}
.band--warm{background:var(--bg-warm)}
.band__inner{max-width:1080px;margin:0 auto}
.kicker{display:block;font-size:var(--kicker);font-weight:600;letter-spacing:.02em;color:var(--text-ter)}
h1,h2,h3{font-weight:600;letter-spacing:-.022em;line-height:1.1;color:var(--text)}
.lead{font-size:clamp(20px,2.4vw,28px);font-weight:400;line-height:1.4;color:var(--text-sub);margin-top:16px;max-width:24em}
.body-text{color:var(--text-sub);max-width:38em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:140px;padding:11px 22px;
  border-radius:980px;border:none;cursor:pointer;background:var(--blue);color:#fff;
  font-size:18px;font-weight:300;transition:background var(--dur),transform .2s}
.btn:hover{background:var(--blue-hover)}
.btn:active{transform:scale(.97)}
.text-link{color:var(--link);display:inline-flex;align-items:center;gap:4px;transition:color var(--dur)}
.text-link:hover{color:var(--blue)}
.text-link .arrow{transition:transform var(--dur)}
.text-link:hover .arrow{transform:translateX(3px)}

.hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:120px var(--pad-x) 80px}
.hero h1{font-size:var(--hero-size);max-width:14ch;text-wrap:balance}
.hero .lead{margin:18px auto 0;text-align:center}
.hero-cta{margin-top:28px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;
  color:var(--text-ter);display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll-hint .dot{width:5px;height:5px;border-radius:50%;background:var(--text-ter);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.4;transform:translateY(5px)}}

.timeline-section{padding:var(--section-y) var(--pad-x)}
.timeline-section .section-head{text-align:center;margin-bottom:80px}
.timeline-wrap{position:relative;max-width:900px;margin:0 auto}
.tl-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--hairline);transform:translateX(-50%)}
.tl-fill{position:absolute;left:50%;top:0;width:2px;height:0;background:var(--blue);transform:translateX(-50%)}
.tl-item{position:relative;width:50%;padding:0 40px 80px;opacity:0;transform:translateY(30px)}
.tl-item.visible{opacity:1;transform:translateY(0);transition:all .7s var(--ease)}
.tl-item:nth-child(odd){left:0;text-align:right}
.tl-item:nth-child(even){left:50%;text-align:left}
.tl-dot{position:absolute;top:8px;width:16px;height:16px;border-radius:50%;background:var(--bg);
  border:2px solid var(--hairline);z-index:2;transition:border-color var(--dur),background var(--dur)}
.tl-item:nth-child(odd) .tl-dot{right:-8px}
.tl-item:nth-child(even) .tl-dot{left:-8px}
.tl-item:hover .tl-dot,.tl-item.active .tl-dot{border-color:var(--blue);background:var(--blue)}
.tl-year{font-size:var(--kicker);font-weight:600;color:var(--text-ter)}
.tl-card{margin-top:12px;background:var(--card-bg);border-radius:16px;padding:24px;
  cursor:pointer;transition:transform var(--dur),box-shadow var(--dur)}
.tl-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.tl-card h3{font-size:20px;margin-top:6px;letter-spacing:-.3px}
.tl-card .role{font-size:var(--small);color:var(--text-sub);margin-top:4px}
.tl-card .expand-hint{font-size:12px;color:var(--blue);margin-top:10px;display:inline-flex;align-items:center;gap:4px}
.tl-detail{max-height:0;overflow:hidden;transition:max-height .6s var(--ease)}
.tl-item.active .tl-detail{max-height:600px}
.tl-detail-inner{padding-top:16px;border-top:1px solid var(--hairline);margin-top:16px;text-align:left}
.tl-detail-inner p{font-size:15px;color:var(--text-sub);line-height:1.6;margin-bottom:12px}
.tl-detail-inner h4{font-size:12px;font-weight:600;color:var(--text-ter);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.tl-detail-inner ul{list-style:none;padding:0}
.tl-detail-inner ul li{position:relative;padding:6px 0 6px 16px;font-size:15px;color:var(--text)}
.tl-detail-inner ul li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.tl-stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tl-stack span{font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;background:var(--bg);color:var(--text-sub);border:1px solid var(--hairline)}

.contact{text-align:center}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;margin-top:56px;
  max-width:880px;margin-left:auto;margin-right:auto;background:var(--hairline);
  border:1px solid var(--hairline);border-radius:18px;overflow:hidden;text-align:left}
.contact-row{display:flex;align-items:center;gap:14px;padding:22px 24px;background:var(--bg);
  transition:background var(--dur);cursor:pointer}
.contact-row:hover{background:var(--bg-warm)}
.c-label{font-size:12px;color:var(--text-ter);font-weight:500}
.c-value{font-size:var(--body-size);font-weight:500;margin-top:2px;color:var(--text);word-break:break-all}

footer{text-align:center;padding:48px var(--pad-x) 64px;color:var(--text-ter);font-size:12px;border-top:1px solid var(--hairline)}

@media(max-width:768px){
  .tl-line{left:20px}
  .tl-fill{left:20px}
  .tl-item{width:100%;left:0!important;text-align:left!important;padding:0 0 60px 52px}
  .tl-item:nth-child(odd) .tl-dot,.tl-item:nth-child(even) .tl-dot{left:12px;right:auto}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo" id="siteName">Michael</span>
  <div class="nav-links">
    <a href="#timeline">经历</a>
    <a href="#contact">联系</a>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="切换主题">🌙</button>
</nav>

<header class="hero band--white" id="top">
  <div>
    <h1 id="heroTitle">打造极致交互与数字艺术。</h1>
    <p class="lead" id="heroSub">Michael · 全栈架构师 / 交互动效专家</p>
    <div class="hero-cta">
      <a class="btn" href="#timeline">查看经历</a>
      <a class="text-link" href="#contact">联系我 <span class="arrow">›</span></a>
    </div>
  </div>
  <div class="scroll-hint"><span>向下滚动</span><span class="dot"></span></div>
</header>

<main>
<section class="band band--warm timeline-section" id="timeline">
  <div class="section-head">
    <span class="kicker">Timeline</span>
    <h2 style="font-size:var(--h2-size);margin-top:8px">项目经历</h2>
  </div>
  <div class="timeline-wrap">
    <div class="tl-line"></div>
    <div class="tl-fill" id="tlFill"></div>
    <div id="tlNodes"></div>
  </div>
</section>

<section class="band band--white contact" id="contact">
  <div>
    <span class="kicker">Contact</span>
    <h2 style="margin-top:8px;font-size:var(--h2-size)">Let's build something great.</h2>
    <p class="lead" style="margin:16px auto 0">如果你也相信细节决定伟大，欢迎随时找我聊聊。</p>
    <div class="contact-grid">
      <a class="contact-row" href="mailto:hi@michaelchen.dev">
        <span><span class="c-label">Email</span><br><span class="c-value">hi@michaelchen.dev</span></span></a>
      <a class="contact-row" href="https://github.com/michaelchen-dev" target="_blank" rel="noopener">
        <span><span class="c-label">GitHub</span><br><span class="c-value">github.com/michaelchen-dev</span></span></a>
      <div class="contact-row" data-copy="MichaelChen_Dev" role="button" tabindex="0">
        <span><span class="c-label">微信 · 点击复制</span><br><span class="c-value">MichaelChen_Dev</span></span></div>
    </div>
  </div>
</section>
</main>

<footer>Designed & Engineered by Michael · © 2026</footer>

<script>
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
let DATA=null;

async function loadData(){
  try{
    const r=await fetch("/api/data");
    if(r.ok){DATA=await r.json();}
  }catch(e){}
  if(!DATA){
    DATA={site:{name:"Michael",heroTitle:"打造极致交互与数字艺术。",heroSub:"Michael · 全栈架构师 / 交互动效专家"},projects:[
      {id:"p1",title:"AETHER-3D 渲染引擎",period:"2025.03 — 2026.01",role:"首席前端架构师",
       desc:"从零主导设计面向浏览器端的次世代3D渲染引擎。",
       results:["60 FPS稳定帧率","首屏加载缩短65%","内存下降40%"],
       stack:["Three.js","WebGL","GSAP"]},
      {id:"p2",title:"NEBULA-OS 云端桌面",period:"2024.06 — 2025.02",role:"动效与UI专家",
       desc:"在浏览器中构建完整云端桌面操作系统体验。",
       results:["Awwwards提名","Lighthouse 100分","响应<8ms"],
       stack:["Vue 3","Canvas API"]}
    ]};
  }
  render();
}

function render(){
  document.getElementById("siteName").textContent=DATA.site.name;
  document.getElementById("heroTitle").textContent=DATA.site.heroTitle;
  document.getElementById("heroSub").textContent=DATA.site.heroSub;
  const wrap=document.getElementById("tlNodes");
  wrap.innerHTML=DATA.projects.map((p,i)=>`
    <div class="tl-item" data-idx="${i}">
      <span class="tl-dot"></span>
      <span class="tl-year">${p.period}</span>
      <div class="tl-card" onclick="toggleCard(${i})">
        <h3>${p.title}</h3>
        <span class="role">${p.role}</span>
        <span class="expand-hint">点击展开 <span class="arrow">›</span></span>
        <div class="tl-detail">
          <div class="tl-detail-inner">
            <p>${p.desc}</p>
            ${p.results&&p.results.length?`<h4>量化成果</h4><ul>${p.results.map(r=>`<li>${r}</li>`).join("")}</ul>`:""}
            ${p.stack&&p.stack.length?`<h4>技术栈</h4><div class="tl-stack">${p.stack.map(s=>`<span>${s}</span>`).join("")}</div>`:""}
          </div>
        </div>
      </div>
    </div>`).join("");
  requestAnimationFrame(()=>{
    document.querySelectorAll(".tl-item").forEach(el=>el.classList.add("visible"));
  });
}

function toggleCard(idx){
  document.querySelectorAll(".tl-item").forEach((el,i)=>{
    el.classList.toggle("active",i===idx&&!el.classList.contains("active"));
  });
}

const themeBtn=document.getElementById("themeBtn");
function applyTheme(m){document.documentElement.dataset.theme=m;themeBtn.textContent=m==="light"?"🌙":"☀️";try{localStorage.setItem("theme",m)}catch(e){}}
applyTheme((()=>{try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}})());
themeBtn.onclick=()=>applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");

document.querySelectorAll("[data-copy]").forEach(el=>{
  el.addEventListener("click",()=>{navigator.clipboard&&navigator.clipboard.writeText(el.dataset.copy)});
});

try{
  if(window.gsap&&window.ScrollTrigger&&!REDUCED){
    gsap.utils.toArray(".tl-item").forEach(el=>{
      gsap.from(el,{y:40,opacity:0,duration:.8,ease:"power2.out",scrollTrigger:{trigger:el,start:"top 85%"}});
    });
    ScrollTrigger.create({trigger:".timeline-wrap",start:"top 70%",end:"bottom 60%",
      onUpdate:s=>{document.getElementById("tlFill").style.height=(s.progress*100)+"%"}});
  }
}catch(e){}

loadData();
</script>
</body>
</html>
