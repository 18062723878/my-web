<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理</title>
<style>
:root{
  --bg-page:#f5f5f7;--bg-card:#ffffff;--bg-subcard:#fafafa;
  --text-main:#1d1d1f;--text-muted:#555555;--text-tip:#999999;
  --border-color:#dddddd;--border-card:#e5e5e5;
  --accent:#0071E3;--badge-bg:#eef4ff;--badge-color:#0071E3;
  --input-bg:#ffffff;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg-page:#000000;--bg-card:#161617;--bg-subcard:#242426;
    --text-main:#f5f5f7;--text-muted:#a1a1a6;--text-tip:#6e6e73;
    --border-color:rgba(255,255,255,0.15);--border-card:rgba(255,255,255,0.08);
    --accent:#2997FF;--badge-bg:rgba(41,151,255,0.15);--badge-color:#2997FF;
    --input-bg:#121212;
  }
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg-page);color:var(--text-main);padding:20px;transition:background-color 300ms,color 300ms}
.login{max-width:360px;margin:100px auto;background:var(--bg-card);padding:40px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid var(--border-card)}
.login h2{margin-bottom:20px;text-align:center}
.login input{width:100%;padding:12px;background:var(--input-bg);color:var(--text-main);border:1px solid var(--border-color);border-radius:8px;margin-bottom:12px;font-size:14px}
.login button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.admin{max-width:960px;margin:0 auto;display:none}
.topbar{display:flex;align-items:center;margin-bottom:16px}
.topbar h2{flex:1}
.topbar a{color:var(--accent);text-decoration:none;font-size:14px}
.section{background:var(--bg-card);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border-card)}
.section h3{margin-bottom:16px;font-size:16px;border-left:4px solid var(--accent);padding-left:10px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-weight:600;font-size:13px;color:var(--text-muted)}
.field input,.field textarea{width:100%;padding:10px;background:var(--input-bg);color:var(--text-main);border:1px solid var(--border-color);border-radius:8px;font-size:14px}
.field textarea{min-height:70px;resize:vertical}
textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:140px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px}
.card{border:1px solid var(--border-card);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--bg-subcard)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:700;font-size:14px}
.card-head .spacer{flex:1}
.mini-btn{padding:4px 10px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-main);border-radius:6px;cursor:pointer;font-size:12px}
.mini-btn.del{color:#ff453a;border-color:#ff453a}
.add-btn{padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:6px 0 12px;cursor:pointer}
.check input{width:auto}
.proj-fields{border-top:1px dashed var(--border-color);margin-top:4px;padding-top:14px;background:var(--bg-card);border-radius:8px;padding:14px;border:1px solid var(--border-card)}
.badge{display:inline-block;background:var(--badge-bg);color:var(--badge-color);font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px;font-weight:400}
.tip{font-size:12px;color:var(--text-tip);margin-top:8px}

.code-blocks-wrap{margin-top:16px;border:1px solid var(--border-color);padding:14px;border-radius:8px;background:var(--bg-subcard)}
.code-block-card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;padding:12px;margin-bottom:12px}
.code-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:600}
.add-code-btn{padding:6px 12px;background:transparent;border:1px dashed var(--accent);color:var(--accent);border-radius:6px;cursor:pointer;font-size:13px}

.save-bar{position:sticky;bottom:10px;text-align:center;padding:10px 0}
.save-btn{padding:14px 44px;background:#34c759;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;box-shadow:0 4px 12px rgba(52,199,89,.4)}
.msg{margin-top:12px;padding:10px;border-radius:8px;display:none;text-align:center}
.msg.ok{background:#d4edda;color:#155724;display:block}
.msg.err{background:#f8d7da;color:#721c24;display:block}
@media(prefers-color-scheme:dark){
  .msg.ok{background:#1b3922;color:#75d58d}
  .msg.err{background:#44191d;color:#ff858d}
}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h2>🔒 后台登录</h2>
  <input type="password" id="pwd" placeholder="请输入管理密码">
  <button onclick="doLogin()">登录</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div class="admin" id="adminBox">
  <div class="topbar"><h2>✏️ 内容管理</h2><a href="/" target="_blank">预览前台 ↗</a></div>

  <div class="section">
    <h3>🏠 站点信息</h3>
    <div class="field"><label>站点名称</label><input id="f_name"></div>
    <div class="field"><label>首页大标题</label><input id="f_heroTitle"></div>
    <div class="field"><label>首页副标题</label><textarea id="f_heroSub"></textarea></div>
    <div class="field"><label>📄 个人简历链接<span class="badge">PDF外链或在线文档地址，留空则首页不显示按钮</span></label><input id="f_resumeUrl" placeholder="例如：https://.../resume.pdf"></div>
  </div>

  <div class="section">
    <h3>👤 个人简介</h3>
    <div class="field"><label>简介副标题<span class="badge">标题下方的短语</span></label><input id="f_aboutSub" placeholder="例如：保持好奇，专注创造价值"></div>
    <div class="field"><label>简介正文内容<span class="badge">支持换行</span></label><textarea id="f_about" style="min-height:90px" placeholder="例如：热衷于在设计与工程的交叉点探索，专注构建体验优雅、实用高效的产品与技术实践。"></textarea></div>
  </div>

  <div class="section">
    <h3>🛠️ 技能与工具 (Bento Grid)</h3>
    <div id="skillsList"></div>
    <button class="add-btn" onclick="addSkill()">＋ 添加技能卡片</button>
    <div class="tip">会在首页展示为便当盒式的技能与工具卡片。支持随时调整顺序与删除。</div>
  </div>

  <!-- 新增：博客与笔记板块管理 -->
  <div class="section">
    <h3>📝 博客与技术笔记</h3>
    <div id="postsList"></div>
    <button class="add-btn" onclick="addPost()">＋ 添加笔记文章</button>
    <div class="tip">在前台展示为文章卡片。可填入文章的外部阅读链接（如知乎、掘金、Notion、微信公众号等）。</div>
  </div>

  <div class="section">
    <h3>🚀 时间线 + 项目</h3>
    <div id="timelineList"></div>
    <button class="add-btn" onclick="addTimeline()">＋ 添加时间节点</button>
    <div class="tip">勾选「挂一个项目卡片」后可添加详细图文、在线试玩 Demo 与多段代码展示。</div>
  </div>

  <div class="section">
    <h3>📮 联系方式（留空 = 前台不显示）</h3>
    <div class="row2">
      <div class="field"><label>📧 邮箱</label><input id="c_email"></div>
      <div class="field"><label>📱 电话</label><input id="c_phone"></div>
      <div class="field"><label>💬 微信号</label><input id="c_wechat"></div>
      <div class="field"><label>🐧 QQ 号</label><input id="c_qq"></div>
      <div class="field"><label>🐙 GitHub 主页</label><input id="c_github" placeholder="https://github.com/用户名"></div>
      <div class="field"><label>🌐 博客 / 其他链接</label><input id="c_blog" placeholder="https://..."></div>
    </div>
  </div>

  <div class="save-bar">
    <button class="save-btn" onclick="saveAll()">💾 保存全部修改</button>
    <div class="msg" id="saveMsg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let DATA={};
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function genId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function showMsg(id,text,type){const el=$(id);el.className="msg "+type;el.textContent=text}

function doLogin(){
  const pwd=$("pwd").value;
  fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pwd})})
  .then(r=>r.json()).then(j=>{
    if(j.ok){sessionStorage.setItem("admin_pwd",pwd);enter()}
    else showMsg("loginMsg","密码错误","err");
  }).catch(()=>showMsg("loginMsg","网络错误","err"));
}
function enter(){$("loginBox").style.display="none";$("adminBox").style.display="block";loadData()}

async function loadData(){
  try{
    const r=await fetch("/api/data");const d=await r.json();
    let tl=Array.isArray(d.timeline)?d.timeline:[];
    DATA={
      site:Object.assign({name:"",heroTitle:"",heroSub:"",aboutSub:"",about:"",resumeUrl:""},d.site||{}),
      skills:Array.isArray(d.skills)?d.skills:[
        { cat:"前端开发", name:"HTML / CSS / JavaScript", desc:"原生现代 Web 标准与响应式设计" },
        { cat:"基础设施", name:"Cloudflare Pages & KV", desc:"边缘无服务器架构部署与全栈实践" }
      ],
      posts:Array.isArray(d.posts)?d.posts:[],
      timeline:tl,
      contact:Object.assign({email:"",phone:"",wechat:"",qq:"",github:"",blog:""},d.contact||{})
    };
  }catch(e){DATA={site:{},skills:[],posts:[],timeline:[],contact:{}}}
  renderAll();
}

function renderAll(){
  $("f_name").value=DATA.site.name||"";
  $("f_heroTitle").value=DATA.site.heroTitle||"";
  $("f_heroSub").value=DATA.site.heroSub||"";
  $("f_resumeUrl").value=DATA.site.resumeUrl||"";
  $("f_aboutSub").value=DATA.site.aboutSub||"";
  $("f_about").value=DATA.site.about||DATA.site.bio||"";
  $("c_email").value=DATA.contact.email||"";
  $("c_phone").value=DATA.contact.phone||"";
  $("c_wechat").value=DATA.contact.wechat||"";
  $("c_qq").value=DATA.contact.qq||"";
  $("c_github").value=DATA.contact.github||"";
  $("c_blog").value=DATA.contact.blog||"";
  renderSkills();
  renderPosts();
  renderTimeline();
}

// 技能卡片
function renderSkills(){
  const box=$("skillsList");box.innerHTML="";
  DATA.skills.forEach((s,i)=>{
    const div=document.createElement("div");div.className="card";
    div.innerHTML=
      '<div class="card-head">🛠️ 技能 '+(i+1)+'<span class="spacer"></span>'+
      '<button class="mini-btn" onclick="moveSkill('+i+',-1)">↑</button>'+
      '<button class="mini-btn" onclick="moveSkill('+i+',1)">↓</button>'+
      '<button class="mini-btn del" onclick="delSkill('+i+')">删除</button></div>'+
      '<div class="row3">'+
        '<div class="field"><label>类别/领域</label><input data-sk="cat" value="'+esc(s.cat)+'" placeholder="如：前端 / 语言 / 工具"></div>'+
        '<div class="field"><label>技能/工具名称</label><input data-sk="name" value="'+esc(s.name)+'" placeholder="如：JavaScript"></div>'+
        '<div class="field"><label>熟练度简述</label><input data-sk="desc" value="'+esc(s.desc)+'" placeholder="如：日常开发与性能调优"></div>'+
      '</div>';
    box.appendChild(div);
  });
}

function addSkill(){collectAll();DATA.skills.push({cat:"",name:"",desc:""});renderSkills()}
function delSkill(i){collectAll();DATA.skills.splice(i,1);renderSkills()}
function moveSkill(i,dir){collectAll();const j=i+dir;if(j<0||j>=DATA.skills.length)return;const t=DATA.skills[i];DATA.skills[i]=DATA.skills[j];DATA.skills[j]=t;renderSkills()}

// 博客文章卡片
function renderPosts(){
  const box=$("postsList");box.innerHTML="";
  DATA.posts.forEach((p,i)=>{
    const div=document.createElement("div");div.className="card";
    div.innerHTML=
      '<div class="card-head">📝 文章 '+(i+1)+'<span class="spacer"></span>'+
      '<button class="mini-btn" onclick="movePost('+i+',-1)">↑</button>'+
      '<button class="mini-btn" onclick="movePost('+i+',1)">↓</button>'+
      '<button class="mini-btn del" onclick="delPost('+i+')">删除</button></div>'+
      '<div class="row3">'+
        '<div class="field"><label>分类标签</label><input data-pt="tag" value="'+esc(p.tag)+'" placeholder="如：#建站心得 / #日常折腾"></div>'+
        '<div class="field"><label>文章标题</label><input data-pt="title" value="'+esc(p.title)+'" placeholder="如：我是如何搭建个人主页的"></div>'+
        '<div class="field"><label>发布日期</label><input data-pt="date" value="'+esc(p.date)+'" placeholder="如：2026.09"></div>'+
      '</div>'+
      '<div class="field"><label>文章外部阅读链接（可不填）</label><input data-pt="link" value="'+esc(p.link)+'" placeholder="如：https://juejin.cn/... 或 https://notion.site/..."></div>'+
      '<div class="field"><label>文章简述</label><textarea data-pt="summary" placeholder="简要概括这篇文章讲了什么">'+esc(p.summary)+'</textarea></div>';
    box.appendChild(div);
  });
}

function addPost(){collectAll();DATA.posts.push({tag:"",title:"",date:"",link:"",summary:""});renderPosts()}
function delPost(i){collectAll();DATA.posts.splice(i,1);renderPosts()}
function movePost(i,dir){collectAll();const j=i+dir;if(j<0||j>=DATA.posts.length)return;const t=DATA.posts[i];DATA.posts[i]=DATA.posts[j];DATA.posts[j]=t;renderPosts()}

// 时间线与项目
function renderTimeline(){
  const box=$("timelineList");box.innerHTML="";
  DATA.timeline.forEach((t,i)=>{
    const p=t.project||null;
    const div=document.createElement("div");div.className="card";
    if(p&&p.id)div.dataset.pid=p.id;

    let blocks = [];
    if(p){
      if(Array.isArray(p.codeBlocks)) blocks = p.codeBlocks;
      else if(p.code) blocks = [{ title:"核心实现", lang:p.codeLang||"", code:p.code }];
    }

    let codeBlocksHtml = "";
    blocks.forEach((b, bIdx)=>{
      codeBlocksHtml += `
        <div class="code-block-card">
          <div class="code-block-head">
            <span>💻 代码板块 ${bIdx + 1}</span>
            <button class="mini-btn del" onclick="delCodeBlock(${i}, ${bIdx})">删除该板块</button>
          </div>
          <div class="row2">
            <div class="field"><label>板块标题</label><input data-cb="title" value="${esc(b.title)}" placeholder="例如：前端界面结构 / 核心算法"></div>
            <div class="field"><label>语言标签</label><input data-cb="lang" value="${esc(b.lang)}" placeholder="例如：html / javascript / python"></div>
          </div>
          <div class="field"><label>代码内容</label><textarea class="mono" data-cb="code">${esc(b.code)}</textarea></div>
        </div>
      `;
    });

    div.innerHTML=
      '<div class="card-head">🚀 节点 '+(i+1)+'<span class="spacer"></span>'+
      '<button class="mini-btn" onclick="moveItem('+i+',-1)">↑</button>'+
      '<button class="mini-btn" onclick="moveItem('+i+',1)">↓</button>'+
      '<button class="mini-btn del" onclick="delItem('+i+')">删除</button></div>'+
      '<div class="row2">'+
        '<div class="field"><label>日期</label><input data-k="date" value="'+esc(t.date)+'" placeholder="例如：2026.08"></div>'+
        '<div class="field"><label>节点标题</label><input data-k="title" value="'+esc(t.title)+'" placeholder="例如：上线个人网站"></div>'+
      '</div>'+
      '<div class="field"><label>节点描述（可不填）</label><textarea data-k="desc">'+esc(t.desc)+'</textarea></div>'+
      '<label class="check"><input type="checkbox" data-k="hasProject" '+(p?"checked":"")+' onchange="toggleProj(this)"> 📁 在这个节点旁挂一个项目卡片</label>'+
      '<div class="proj-fields" style="'+(p?"":"display:none")+'">'+
        '<div class="field"><label>项目名称<span class="badge">卡片 + 详情页标题</span></label><input data-k="p_title" value="'+esc(p&&p.title)+'" placeholder="例如：个人作品集网站"></div>'+
        '<div class="row2">'+
          '<div class="field"><label>技术标签（逗号分隔）</label><input data-k="p_tags" value="'+esc(p&&p.tags)+'" placeholder="例如：HTML, CSS, JS"></div>'+
          '<div class="field"><label>项目外链（可不填）</label><input data-k="p_link" value="'+esc(p&&p.link)+'" placeholder="https://..."></div>'+
        '</div>'+
        '<div class="field"><label>🎮 在线试玩 / Live Demo 演示链接<span class="badge">详情页内嵌试玩沙盒，可不填</span></label><input data-k="p_demo" value="'+esc(p&&p.demoUrl)+'" placeholder="例如：https://demo.example.com"></div>'+
        '<div class="field"><label>卡片简介<span class="badge">显示在时间线旁的卡片上</span></label><textarea data-k="p_summary">'+esc(p&&p.summary)+'</textarea></div>'+
        '<div class="field"><label>详细介绍<span class="badge">详情页展示，空行分段</span></label><textarea data-k="p_detail" style="min-height:100px">'+esc(p&&p.detail)+'</textarea></div>'+
        '<div class="code-blocks-wrap">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
            '<strong>📂 代码展示板块（可添加多个）</strong>'+
            '<button class="add-code-btn" onclick="addCodeBlock('+i+')">＋ 添加代码板块</button>'+
          '</div>'+
          '<div class="code-list">'+codeBlocksHtml+'</div>'+
        '</div>'+
      '</div>';
    box.appendChild(div);
  });
}

function toggleProj(cb){cb.closest(".card").querySelector(".proj-fields").style.display=cb.checked?"block":"none"}

function collectAll(){
  DATA.site.name=$("f_name").value;
  DATA.site.heroTitle=$("f_heroTitle").value;
  DATA.site.heroSub=$("f_heroSub").value;
  DATA.site.resumeUrl=$("f_resumeUrl").value;
  DATA.site.aboutSub=$("f_aboutSub").value;
  DATA.site.about=$("f_about").value;

  // 收集技能
  DATA.skills=[];
  document.querySelectorAll("#skillsList .card").forEach(c=>{
    DATA.skills.push({
      cat: c.querySelector('[data-sk="cat"]').value,
      name: c.querySelector('[data-sk="name"]').value,
      desc: c.querySelector('[data-sk="desc"]').value
    });
  });

  // 收集文章
  DATA.posts=[];
  document.querySelectorAll("#postsList .card").forEach(c=>{
    DATA.posts.push({
      tag: c.querySelector('[data-pt="tag"]').value,
      title: c.querySelector('[data-pt="title"]').value,
      date: c.querySelector('[data-pt="date"]').value,
      link: c.querySelector('[data-pt="link"]').value,
      summary: c.querySelector('[data-pt="summary"]').value
    });
  });

  // 收集时间线
  DATA.timeline=[];
  document.querySelectorAll("#timelineList .card").forEach(card=>{
    const g=k=>card.querySelector('[data-k="'+k+'"]').value;
    const node={date:g("date"),title:g("title"),desc:g("desc")};
    if(card.querySelector('[data-k="hasProject"]').checked){
      const id=card.dataset.pid||genId();
      card.dataset.pid=id;
      
      const codeBlocks = [];
      card.querySelectorAll(".code-block-card").forEach(cbCard=>{
        codeBlocks.push({
          title: cbCard.querySelector('[data-cb="title"]').value,
          lang: cbCard.querySelector('[data-cb="lang"]').value,
          code: cbCard.querySelector('[data-cb="code"]').value
        });
      });

      node.project={
        id:id,
        title:g("p_title"),
        tags:g("p_tags"),
        link:g("p_link"),
        demoUrl:g("p_demo"),
        summary:g("p_summary"),
        detail:g("p_detail"),
        codeBlocks: codeBlocks,
        codeLang: codeBlocks.length ? codeBlocks[0].lang : "",
        code: codeBlocks.length ? codeBlocks[0].code : ""
      };
    }
    DATA.timeline.push(node);
  });
  DATA.contact={email:$("c_email").value,phone:$("c_phone").value,wechat:$("c_wechat").value,qq:$("c_qq").value,github:$("c_github").value,blog:$("c_blog").value};
}

function addTimeline(){collectAll();DATA.timeline.push({date:"",title:"",desc:""});renderTimeline()}
function delItem(i){collectAll();if(!confirm("确定删除节点 "+(i+1)+" 吗？挂着的项目也会一起删除。"))return;DATA.timeline.splice(i,1);renderTimeline()}
function moveItem(i,dir){collectAll();const j=i+dir;if(j<0||j>=DATA.timeline.length)return;const t=DATA.timeline[i];DATA.timeline[i]=DATA.timeline[j];DATA.timeline[j]=t;renderTimeline()}

function addCodeBlock(timelineIdx){
  collectAll();
  const proj = DATA.timeline[timelineIdx].project;
  if(proj){
    if(!Array.isArray(proj.codeBlocks)) proj.codeBlocks = [];
    proj.codeBlocks.push({ title:"", lang:"", code:"" });
  }
  renderTimeline();
}
function delCodeBlock(timelineIdx, blockIdx){
  collectAll();
  const proj = DATA.timeline[timelineIdx].project;
  if(proj && Array.isArray(proj.codeBlocks)){
    proj.codeBlocks.splice(blockIdx, 1);
  }
  renderTimeline();
}

async function saveAll(){
  collectAll();
  const pwd=sessionStorage.getItem("admin_pwd");
  try{
    const r=await fetch("/api/data",{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+pwd},body:JSON.stringify(DATA)});
    const j=await r.json();
    showMsg("saveMsg",j.ok?"✅ 保存成功！前台刷新即可看到":"❌ "+(j.error||"保存失败"),j.ok?"ok":"err");
  }catch(e){showMsg("saveMsg","❌ 网络错误："+e.message,"err")}
}

if(sessionStorage.getItem("admin_pwd"))enter();
</script>
